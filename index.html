      var sel = (placement && placement.row === r && placement.col === c) ? 'selected' : '';
      var titleAttr = sel ? ' title="Click to un-place (table for later)"' : '';
      cells += '<div class="matrix-cell mc-bg-' + cell.color + ' ' + sel + '" data-row="' + r + '" data-col="' + c + '"' + titleAttr + '>' +
        (withKbd ? '<div class="mc-key">' + cell.kbd + '</div>' : '') +
        '<div class="mc-label">' + cell.label + '</div>' +
        '</div>';
    }
  }
  return '<div class="matrix-wrap">' +
    '<div class="axis-y-title">Potential</div>' +
    '<div class="axis-y-labels"><span><b class="axis-code">1</b> &middot; HIGH</span><span><b class="axis-code">2</b> &middot; MED</span><span><b class="axis-code">3</b> &middot; LOW</span></div>' +
    '<div class="matrix-grid">' + cells + '</div>' +
    '<div class="axis-x-labels"><span><b class="axis-code">A</b> &middot; LOW</span><span><b class="axis-code">B</b> &middot; MED</span><span><b class="axis-code">C</b> &middot; HIGH</span></div>' +
    '<div class="axis-x-title">Performance</div>' +
    '</div>';
}

function updateReadiness(v) { var g = getActiveGm(); if (g) { g.readiness = v; saveState(); } }
function updateField(field, v) { var g = getActiveGm(); if (g) { g[field] = v; saveState(); } }


function navigateGM(delta) {
  var list = visibleGms();
  if (list.length === 0) return;
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (list[i].id === state.activeGmId) { idx = i; break; }
  if (idx < 0) idx = 0;
  var n = idx + delta;
  if (n < 0) n = list.length - 1;
  if (n >= list.length) n = 0;
  state.activeGmId = list[n].id;
  var ng = list[n];
  if (ng.status === 'pending') ng.status = 'in_discussion';
  saveState();
  render();
}

// ===== DISTRIBUTION CHECK (Doc 07 calibration targets) =====
var DIST_MIN_FOR_ALERTS = 6;
function computeDistribution() {
  var placed = visibleGms().filter(function(g) { return g.status === 'placed' && g.placement; });
  var total = placed.length;
  function n(predicate) { return placed.filter(predicate).length; }
  // Groupings by matrix cell color (5 groups, 9 cells)
  var green  = n(function(g) { return g.placement.row === 0 && g.placement.col === 2; });
  var blue   = n(function(g) { return (g.placement.row === 0 && g.placement.col === 1) || (g.placement.row === 1 && g.placement.col === 2); });
  var white  = n(function(g) { return g.placement.row === 1 && g.placement.col === 1; });
  var yellow = n(function(g) {
    return (g.placement.row === 0 && g.placement.col === 0) ||
           (g.placement.row === 1 && g.placement.col === 0) ||
           (g.placement.row === 2 && g.placement.col === 1) ||
           (g.placement.row === 2 && g.placement.col === 2);
  });
  var red = n(function(g) { return g.placement.row === 2 && g.placement.col === 0; });
  return { total: total, green: green, blue: blue, white: white, yellow: yellow, red: red };
}
function distStatus(key, actual, total) {
  if (total < DIST_MIN_FOR_ALERTS) return 'neutral';
  if (total === 0) return 'neutral';
  var pct = actual / total;
  if (key === 'green') {
    if (pct > 0.25) return 'alert';
    if (pct > 0.15 || pct < 0.05) return 'warn';
    return 'ok';
  }
  if (key === 'blue') {
    if (pct > 0.50) return 'alert';
    if (pct > 0.40 || pct < 0.20) return 'warn';
    return 'ok';
  }
  if (key === 'white') {
    if (pct < 0.25) return 'alert';
    if (pct < 0.35 || pct > 0.50) return 'warn';
    return 'ok';
  }
  if (key === 'yellow') {
    if (pct > 0.35) return 'alert';
    if (pct > 0.25) return 'warn';
    return 'ok';
  }
  if (key === 'red') {
    if (pct > 0.08) return 'alert';
    if (actual > 0) return 'warn';
    return 'ok';
  }
  return 'neutral';
}
function distStatusLabel(s) {
  if (s === 'ok') return '✓ Within target';
  if (s === 'warn') return '⚠ Off target';
  if (s === 'alert') return '⚠ Recalibrate';
  return 'Building sample';
}
function renderDistributionStrip() {
  var d = computeDistribution();
  var pctStr = function(n) { return d.total > 0 ? Math.round((n / d.total) * 100) + '%' : '—'; };
  var swatchColor = { green:'var(--cell-green)', blue:'var(--cell-blue)', white:'var(--cell-white)', yellow:'var(--cell-yellow)', red:'var(--cell-red)' };
  function tile(label, sub, count, key, targetText) {
    var s = distStatus(key, count, d.total);
    return '<div class="dist-tile ' + s + '">' +
      '<div class="dist-name"><span><span class="dist-swatch" style="background:' + swatchColor[key] + '"></span>' + label + '</span><span class="info-mark">' + sub + '</span></div>' +
      '<div class="dist-num-row"><span class="dist-count">' + count + '</span><span class="dist-pct">' + pctStr(count) + '</span></div>' +
      '<div class="dist-target">Target ' + targetText + '</div>' +
      '<div class="dist-status ' + s + '">' + distStatusLabel(s) + '</div>' +
      '</div>';
  }
  return '<div class="dist-strip">' +
    tile('Green', 'Ready Now', d.green, 'green', '~10%') +
    tile('Blue', 'Stretch · Ready 12–24', d.blue, 'blue', '~30%') +
    tile('White', 'Solid / Honored 3', d.white, 'white', '~40%') +
    tile('Yellow', 'Watch · Below Exp · HIIR', d.yellow, 'yellow', '~20%') +
    tile('Red', 'Concern', d.red, 'red', '0%') +
    '</div>';
}


// ===== COMPARE VIEW =====
var COMPARE_MAX = 3;
var GROUP_PREFIX = 'grp:';
var GROUP_FIELD_LABEL = { club: 'Club', department: 'Department', roleTitle: 'Role' };

// A compare slot is either a leader id or a cohort token 'grp:<field>:<value>'
function groupToken(field, value) { return GROUP_PREFIX + field + ':' + value; }
function parseGroupToken(token) {
  if (token.indexOf(GROUP_PREFIX) !== 0) return null;
  var rest = token.slice(GROUP_PREFIX.length);
  var i = rest.indexOf(':');
  if (i < 0) return null;
  return { field: rest.slice(0, i), value: rest.slice(i + 1) };
}
function groupMembers(field, value) {
  return state.gms.filter(function(g) { return (g[field] || '').trim() === value; });
}
function compareEntry(token) {
  var grp = parseGroupToken(token);
  if (grp) {
    var members = groupMembers(grp.field, grp.value);
    if (members.length === 0) return null;
    var scores = CATEGORIES.map(function(c) {
      var sum = 0, n = 0;
      members.forEach(function(g) {
        var v = getScoreNumeric(g, c.key);
        if (v != null) { sum += v; n += 1; }
      });
      return n > 0 ? (sum / n) : null;
    });
    return {
      key: token, isGroup: true, name: grp.value,
      sub: (GROUP_FIELD_LABEL[grp.field] || grp.field) + ' \u00b7 average of ' + members.length + ' leader' + (members.length === 1 ? '' : 's'),
      kind: 'avg', scores: scores, headlines: null, headshot: ''
    };
  }
  var g = null;
  for (var i = 0; i < state.gms.length; i++) if (state.gms[i].id === token) { g = state.gms[i]; break; }
  if (!g) return null;
  return {
    key: token, isGroup: false, name: g.name || '(no name)',
    sub: [g.roleTitle, g.club].filter(function(x) { return !!x; }).join(' \u00b7 '),
    kind: '', scores: CATEGORIES.map(function(c) { return getScoreNumeric(g, c.key); }),
    headlines: CATEGORIES.map(function(c) { return g[c.key + 'Headline'] || ''; }),
    headshot: g.headshotDataUrl || ''
  };
}
function compareEntries() {
  return state.compareSelection.map(compareEntry).filter(function(e) { return !!e; });
}
// Cohorts worth offering: 2+ members, drawn from the currently visible set
function availableGroups() {
  var out = [];
  var vis = visibleGms();
  ['club', 'department', 'roleTitle'].forEach(function(field) {
    var seen = [];
    vis.forEach(function(g) {
      var v = (g[field] || '').trim();
      if (v && seen.indexOf(v) < 0) seen.push(v);
    });
    seen.sort().forEach(function(v) {
      var n = groupMembers(field, v).length;
      if (n >= 2) out.push({ field: field, value: v, count: n, token: groupToken(field, v) });
    });
  });
  return out;
}

function renderCompare() {
  var selected = compareEntries();

  var chips = selected.map(function(e, i) {
    var color = GM_COMPARE_COLORS[i];
    return '<span class="cmp-chip' + (e.isGroup ? ' group' : '') + '" style="background:' + color + '" title="' + esc(e.sub) + '">' +
      (e.isGroup ? '<span class="cmp-chip-kind">avg</span>' : '') +
      esc(e.name) +
      ' <button class="cmp-chip-rm" onclick="removeFromCompareIdx(' + i + ')" title="Remove">&times;</button>' +
      '</span>';
  }).join('');
  var atMax = selected.length >= COMPARE_MAX;
  var addBtn = '<button class="cmp-add" id="cmpAddBtn" onclick="showCompareAddPopover(event)"' + (atMax ? ' disabled' : '') + '>+ Add</button>';

  var toggleSpider = '<button class="' + (state.compareChartType === 'spider' ? 'active' : '') + '" onclick="setCompareChart(\'spider\')">Spider</button>';
  var toggleBar = '<button class="' + (state.compareChartType === 'bar' ? 'active' : '') + '" onclick="setCompareChart(\'bar\')">Bar</button>';
  var toggle = '<div class="cmp-toggle">' + toggleSpider + toggleBar + '</div>';

  var body;
  if (selected.length < 2) {
    body = '<div class="cmp-empty">Pick 2 or 3 leaders &mdash; or whole cohorts like a club or a role &mdash; to compare their 6-category scores.<br><span style="font-size:12px;color:var(--ink4);">Spider chart shows pattern. Bar chart shows precision. Cohorts plot as a dashed average.</span></div>';
  } else {
    body = (state.compareChartType === 'spider')
      ? renderSpiderChart(selected)
      : renderBarChart(selected);
    body += renderCompareLegend(selected) + renderCompareTable(selected);
  }

  return '<div class="cmp-wrap" style="position:relative;">' +
    '<div class="cmp-hdr">' +
      '<div class="cmp-pick">' +
        '<div class="cmp-pick-label">Comparing (up to ' + COMPARE_MAX + ' leaders or cohorts)</div>' +
        '<div class="cmp-chips">' + chips + addBtn + '</div>' +
      '</div>' +
      toggle +
    '</div>' +
    '<div class="cmp-chart">' + body + '</div>' +
    '<div id="cmpAddPopover"></div>' +
    '</div>';
}

function renderCompareLegend(entries) {
  var items = entries.map(function(e, i) {
    return '<span class="cmp-legend-item"><span class="cmp-swatch" style="background:' + GM_COMPARE_COLORS[i] + (e.isGroup ? ';border:2px dashed #fff;box-shadow:0 0 0 1px ' + GM_COMPARE_COLORS[i] : '') + '"></span>' +
      esc(e.name) + (e.sub ? ' &middot; <span style="color:var(--ink3)">' + esc(e.sub) + '</span>' : '') + '</span>';
  }).join('');
  return '<div class="cmp-legend">' + items + '</div>';
}

function renderCompareTable(entries) {
  var thead = '<tr><th>Category</th>';
  entries.forEach(function(e, i) {
    thead += '<th style="color:' + GM_COMPARE_COLORS[i] + '">' + esc(e.name) + (e.isGroup ? ' <span style="font-weight:400;font-size:10px;">(avg)</span>' : '') + '</th>';
  });
  thead += '</tr>';
  var rows = '';
  CATEGORIES.forEach(function(c, ci) {
    rows += '<tr><td><strong>' + c.num + '. ' + esc(c.name) + '</strong></td>';
    entries.forEach(function(e) {
      var v = e.scores[ci];
      var disp = (v == null) ? '—' : (e.isGroup ? v.toFixed(2) : String(v));
      var h = (!e.isGroup && e.headlines) ? e.headlines[ci] : '';
      rows += '<td><strong>' + esc(disp) + '</strong>' + (h ? '<div style="font-size:11px;color:var(--ink3)">' + esc(h) + '</div>' : '') + '</td>';
    });
    rows += '</tr>';
  });
  // Overall row
  rows += '<tr style="background:var(--surface2)"><td><strong>Overall</strong></td>';
  entries.forEach(function(e) {
    var sum = 0, n = 0;
    e.scores.forEach(function(v) { if (v != null) { sum += v; n += 1; } });
    rows += '<td><strong>' + (n ? (sum / n).toFixed(2) : '—') + '</strong></td>';
  });
  rows += '</tr>';
  return '<table class="cmp-cats-table">' + thead + rows + '</table>';
}

function getScoreNumeric(g, catKey) {
  var v = g[catKey + 'Score'];
  if (!v || v === 'N/A') return null;
  var n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function renderSpiderChart(gms) {
  var size = 540, cx = size / 2, cy = size / 2, maxR = 180;
  var angles = [];
  for (var i = 0; i < 6; i++) angles.push((i * 60 - 90) * Math.PI / 180);
  var svg = '<svg viewBox="0 0 ' + size + ' ' + (size + 20) + '" role="img" aria-label="Spider chart comparing leaders">';
  for (var r = 1; r <= 5; r++) {
    var rd = maxR * r / 5;
    var pts = angles.map(function(a) { return (cx + Math.cos(a) * rd).toFixed(1) + ',' + (cy + Math.sin(a) * rd).toFixed(1); }).join(' ');
    svg += '<polygon points="' + pts + '" fill="none" stroke="currentColor" stroke-opacity="0.10" stroke-width="1"/>';
  }
  for (var i = 0; i < 6; i++) {
    var ex = cx + Math.cos(angles[i]) * maxR;
    var ey = cy + Math.sin(angles[i]) * maxR;
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + ex.toFixed(1) + '" y2="' + ey.toFixed(1) + '" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>';
  }
  for (var r = 1; r <= 5; r++) {
    svg += '<text x="' + (cx + 4) + '" y="' + (cy - maxR * r / 5 - 2).toFixed(1) + '" font-size="10" fill="currentColor" fill-opacity="0.45" font-family="DM Sans,sans-serif">' + r + '</text>';
  }
  gms.forEach(function(g, gi) {
    var color = GM_COMPARE_COLORS[gi];
    var pts = [];
    var dots = '';
    for (var ci = 0; ci < 6; ci++) {
      var score = g.scores[ci];
      var rd = (score == null) ? 0 : maxR * Math.max(0, Math.min(5, score)) / 5;
      var x = cx + Math.cos(angles[ci]) * rd;
      var y = cy + Math.sin(angles[ci]) * rd;
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
      if (score != null) dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="' + color + '"/>';
    }
    svg += '<polygon points="' + pts.join(' ') + '" fill="' + color + '" fill-opacity="' + (g.isGroup ? '0.10' : '0.18') + '" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round"' + (g.isGroup ? ' stroke-dasharray="7 4"' : '') + '/>';
    svg += dots;
  });
  for (var i = 0; i < 6; i++) {
    var a = angles[i];
    var lx = cx + Math.cos(a) * (maxR + 28);
    var ly = cy + Math.sin(a) * (maxR + 28);
    var anchor = (Math.abs(Math.cos(a)) < 0.3) ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    var dy = (Math.sin(a) < -0.5) ? 0 : (Math.sin(a) > 0.5 ? 14 : 4);
    svg += '<text x="' + lx.toFixed(1) + '" y="' + (ly + dy).toFixed(1) + '" text-anchor="' + anchor + '" font-size="12" font-weight="600" fill="currentColor" font-family="DM Sans,sans-serif">' + (i + 1) + '. ' + CAT_SHORT_NAMES[i] + '</text>';
  }
  svg += '</svg>';
  return svg;
}

function renderBarChart(gms) {
  var W = 680, H = 380;
  var padL = 40, padR = 20, padT = 20, padB = 80;
  var plotW = W - padL - padR;
  var plotH = H - padT - padB;
  var groups = 6;
  var barsPerGroup = gms.length;
  var groupGap = 18;
  var groupW = (plotW - groupGap * (groups - 1)) / groups;
  var barW = (groupW - 4 * (barsPerGroup - 1)) / barsPerGroup;
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart comparing leader scores">';
  for (var v = 0; v <= 5; v++) {
    var y = padT + plotH - (v / 5) * plotH;
    svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="currentColor" stroke-opacity="0.10" stroke-width="1"/>';
    svg += '<text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.55" font-family="DM Sans,sans-serif">' + v + '</text>';
  }
  for (var gi = 0; gi < groups; gi++) {
    var gx = padL + gi * (groupW + groupGap);
    var lx = gx + groupW / 2;
    var ly = padT + plotH + 18;
    svg += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor" font-family="DM Sans,sans-serif">' + (gi + 1) + '. ' + CAT_SHORT_NAMES[gi] + '</text>';
    gms.forEach(function(g, bi) {
      var score = g.scores[gi];
      var bx = gx + bi * (barW + 4);
      if (score == null) {
        var ty = padT + plotH - 2;
        svg += '<text x="' + (bx + barW / 2).toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity="0.4">N/A</text>';
        return;
      }
      var bh = (score / 5) * plotH;
      var by = padT + plotH - bh;
      svg += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + GM_COMPARE_COLORS[bi] + '" fill-opacity="' + (g.isGroup ? '0.55' : '1') + '" rx="2"' + (g.isGroup ? ' stroke="' + GM_COMPARE_COLORS[bi] + '" stroke-width="1.5" stroke-dasharray="4 3"' : '') + '/>';
      svg += '<text x="' + (bx + barW / 2).toFixed(1) + '" y="' + (by - 4).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor" font-family="DM Sans,sans-serif">' + (g.isGroup ? score.toFixed(1) : score) + '</text>';
    });
  }
  svg += '<text x="' + (padL - 30) + '" y="' + (padT + plotH / 2) + '" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor" font-family="DM Sans,sans-serif" transform="rotate(-90, ' + (padL - 30) + ', ' + (padT + plotH / 2) + ')">Score (1–5)</text>';
  svg += '</svg>';
  return svg;
}

function showCompareAddPopover(evt) {
  evt.stopPropagation();
  var btn = document.getElementById('cmpAddBtn');
  if (!btn) return;
  var pop = document.getElementById('cmpAddPopover');
  if (!pop) return;
  if (pop.innerHTML.trim() !== '') { pop.innerHTML = ''; return; }
  var available = visibleGms().filter(function(g) { return state.compareSelection.indexOf(g.id) < 0; });
  var groups = availableGroups().filter(function(gr) { return state.compareSelection.indexOf(gr.token) < 0; });
  if (available.length === 0 && groups.length === 0) {
    pop.innerHTML = '<div class="cmp-add-popover" style="left:24px;top:160px;">Nothing left to add.</div>';
    return;
  }
  // Index-based dispatch so club/role names with apostrophes can't break the handler
  window.__cmpOpts = [];
  var opts = '';
  if (groups.length) {
    opts += '<div class="cmp-add-section">Cohorts (average)</div>';
    opts += groups.map(function(gr) {
      var idx = window.__cmpOpts.push(gr.token) - 1;
      var ico = gr.field === 'club' ? 'CL' : (gr.field === 'department' ? 'DE' : 'RO');
      return '<div class="cmp-add-option" onclick="addToCompareIdx(' + idx + ')">' +
        '<span class="cmp-grp-ico">' + ico + '</span>' +
        '<div><div>' + esc(gr.value) + '</div><div style="font-size:11px;color:var(--ink3)">' +
        esc(GROUP_FIELD_LABEL[gr.field] || gr.field) + ' \u00b7 ' + gr.count + ' leaders</div></div></div>';
    }).join('');
  }
  if (available.length) {
    opts += '<div class="cmp-add-section">Leaders</div>';
    opts += available.map(function(g) {
      var idx = window.__cmpOpts.push(g.id) - 1;
      var thumb = g.headshotDataUrl
        ? '<img class="qr-thumb" src="' + esc(g.headshotDataUrl) + '" alt="">'
        : '<span class="qr-thumb-init">' + esc(getInitials(g.name)) + '</span>';
      return '<div class="cmp-add-option" onclick="addToCompareIdx(' + idx + ')">' + thumb +
        '<div><div>' + esc(g.name) + '</div><div style="font-size:11px;color:var(--ink3)">' +
        esc([g.roleTitle, g.club].filter(function(x) { return !!x; }).join(' \u00b7 ')) + '</div></div></div>';
    }).join('');
  }
  var rect = btn.getBoundingClientRect();
  var wrapRect = btn.closest('.cmp-wrap').getBoundingClientRect();
  var top = rect.bottom - wrapRect.top + 6;
  var left = rect.left - wrapRect.left;
  pop.innerHTML = '<div class="cmp-add-popover" style="left:' + left + 'px;top:' + top + 'px;">' + opts + '</div>';
  setTimeout(function() {
    document.addEventListener('click', closeCompareAddPopoverOnce, { once: true });
  }, 50);
}
function closeCompareAddPopoverOnce() {
  var pop = document.getElementById('cmpAddPopover');
  if (pop) pop.innerHTML = '';
}
function addToCompare(token) {
  if (state.compareSelection.length >= COMPARE_MAX) return;
  if (state.compareSelection.indexOf(token) >= 0) return;
  state.compareSelection.push(token);
  saveState();
  closeCompareAddPopoverOnce();
  render();
}
function addToCompareIdx(i) {
  var list = window.__cmpOpts || [];
  if (i < 0 || i >= list.length) return;
  addToCompare(list[i]);
}
function removeFromCompareIdx(i) {
  if (i < 0 || i >= state.compareSelection.length) return;
  state.compareSelection.splice(i, 1);
  saveState();
  render();
}
function removeFromCompare(gmId) {
  state.compareSelection = state.compareSelection.filter(function(id) { return id !== gmId; });
  saveState();
  render();
}
function setCompareChart(type) {
  state.compareChartType = type;
  saveState();
  render();
}

// ===== HEADSHOT UPLOAD =====
function handleHeadshotUpload(evt) {
  var file = evt.target.files && evt.target.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Please pick an image file'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // Center-crop to square, resize to 300px
      var size = 300;
      var minSide = Math.min(img.width, img.height);
      var sx = (img.width - minSide) / 2;
      var sy = (img.height - minSide) / 2;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      // Update hidden field + preview
      var input = document.querySelector('#modalBody [data-field="headshotDataUrl"]');
      if (input) input.value = dataUrl;
      var prev = document.getElementById('headshotPreview');
      if (prev) prev.innerHTML = '<img src="' + dataUrl + '" alt="">';
      // Add a Remove button if not present
      var btns = document.querySelector('.headshot-btns');
      if (btns && !btns.querySelector('.danger')) {
        var rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'headshot-btn danger';
        rm.textContent = 'Remove';
        rm.onclick = removeHeadshot;
        btns.appendChild(rm);
      }
      toast('Headshot ready');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeHeadshot() {
  var input = document.querySelector('#modalBody [data-field="headshotDataUrl"]');
  if (input) input.value = '';
  var prev = document.getElementById('headshotPreview');
  if (prev) {
    var nameField = document.querySelector('#modalBody [data-field="name"]');
    var name = nameField ? nameField.value : '';
    prev.innerHTML = '<div class="initials">' + esc(getInitials(name)) + '</div>';
  }
  var btn = document.querySelector('.headshot-btns .danger');
  if (btn) btn.parentNode.removeChild(btn);
}

function saveGM() {
  var fields = {};
  var inputs = document.querySelectorAll('#modalBody [data-field]');
  for (var i = 0; i < inputs.length; i++) {
    fields[inputs[i].getAttribute('data-field')] = inputs[i].value;
  }
  if (!fields.name || !fields.name.trim()) { toast('Leader Name is required'); return; }
  if (state.editingGmId) {
    for (var j = 0; j < state.gms.length; j++) {
      if (state.gms[j].id === state.editingGmId) {
        for (var k in fields) if (Object.prototype.hasOwnProperty.call(fields, k)) state.gms[j][k] = fields[k];
        break;
      }
    }
  } else {
    var g = newGM();
    for (var k2 in fields) if (Object.prototype.hasOwnProperty.call(fields, k2)) g[k2] = fields[k2];
    g.id = fields.id || g.id;
    state.gms.push(g);
  }
  var wasEdit = !!state.editingGmId;
  saveState();
  closeModal();
  render();
  toast(wasEdit ? 'Leader updated' : 'Leader added');
}

function deleteGM(skip) {
  if (!state.editingGmId) return;
  var g = null;
  for (var i = 0; i < state.gms.length; i++) if (state.gms[i].id === state.editingGmId) { g = state.gms[i]; break; }
  if (!g) return;
  if (!skip) {
    confirmDialog('Delete this leader?', 'Delete ' + (g.name || 'this leader') + ' from the session? This cannot be undone.', 'Delete', true).then(function(ok) { if (ok) deleteGM(true); });
    return;
  }
  state.gms = state.gms.filter(function(x) { return x.id !== state.editingGmId; });
  if (state.activeGmId === state.editingGmId) state.activeGmId = null;
  saveState();
  closeModal();
  render();
  toast('Leader removed');
}

// ===== EXPORT =====
function exportCSV() {
  if (state.gms.length === 0) { toast('No leaders to export'); return; }
  var headers = [
    'Name', 'Department', 'Role Title', 'Club', 'GM', 'Club Type',
    'Years with Century', 'Years in Leadership Role', 'Years at this Club'
  ];
  CATEGORIES.forEach(function(c, idx) {
    var short = CAT_SHORT_NAMES[idx];
    headers.push(short + ' Score');
    headers.push(short + ' Headline');
    headers.push(short + ' Narrative');
  });
  headers = headers.concat([
    'Highlights', 'Edges', 'Opportunities', 'GM Recommendation',
    'Matrix Cell', 'Matrix Row (0=HighPot)', 'Matrix Col (0=LowPerf)',
    'Readiness Call', 'Next Role Target', 'Successor Candidate',
    'Status', 'Placed At',
    'Session Notes', 'Room Vote',
    'Last Cycle Cell', 'Last Cycle Row', 'Last Cycle Col', 'Last Cycle Date'
  ]);
  var rows = state.gms.map(function(g) {
    var row = [
      g.name, g.department, g.roleTitle, g.club, g.gm, g.clubType,
      g.yearsWithCentury, g.yearsAsGmTotal, g.yearsAtClub
    ];
    CATEGORIES.forEach(function(c) {
      row.push(g[c.key + 'Score'] || '');
      row.push(g[c.key + 'Headline'] || '');
      row.push(g[c.key + 'Narrative'] || '');
    });
    row = row.concat([
      g.highlights, g.edges, g.opportunities, g.gmRecommendation,
      g.placement ? g.placement.label : '',
      g.placement ? g.placement.row : '',
      g.placement ? g.placement.col : '',
      g.readiness, g.nextRole, g.successor,
      g.status, g.placedAt || '',
      g.roomNotes || '', g.consensus || '',
      g.lastCyclePlacementLabel || '', g.lastCyclePlacementRow || '',
      g.lastCyclePlacementCol || '', g.lastCycleDate || ''
    ]);
    return row;
  });
  var allRows = [headers].concat(rows);
  var csv = allRows.map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var ts = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = 'draft_board_dh_session_' + ts + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  toast('CSV exported');
}
function csvEscape(v) {
  if (v == null) return '';
  var s = String(v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

    m['Cat ' + i + ' Narrative'] = key + 'Narrative';
  }
  return m;
})();

function parseCsv(text) {
  // Strip UTF-8 BOM if present
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var rows = [], row = [], field = '', inQ = false, i = 0;
  while (i < text.length) {
    var c = text.charAt(i);
    if (inQ) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; }
        else { inQ = false; i++; }
      } else { field += c; i++; }
    } else {
      if (c === '"') { inQ = true; i++; }
      else if (c === ',') { row.push(field); field = ''; i++; }
      else if (c === '\r') { i++; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; }
      else { field += c; i++; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function openCsvImport() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,text/csv';
  input.style.display = 'none';
  input.onchange = function(e) {

  };

}

  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  toast('Word doc exported (' + sorted.length + ' cards)');
}
function wordScoreColor(score) {
  if (!score || score === 'N/A' || score === '—') return '#edf0ec';
  var n = parseFloat(score);
  if (isNaN(n)) return '#edf0ec';
  var r = Math.round(n);
  if (r >= 5) return '#D5E8D4';
  if (r === 4) return '#DAE8FC';
  if (r === 3) return '#FFFFFF';
  if (r === 2) return '#FFF2CC';
  if (r <= 1) return '#F8CECC';
  return '#edf0ec';
}
function nl(s) { return esc(s || '').replace(/\n/g, '<br/>'); }
function wordSectionLabel(text) {
  return '<div style="font-size:9pt;font-weight:bold;color:#15803d;text-transform:uppercase;letter-spacing:1pt;margin:10pt 0 4pt;">' + text + '</div>';

function buildWordDoc(gms) {
  var head = '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="UTF-8"><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>CGP Draft Board Cards — Department Heads &amp; Managers</title>' +
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
    '<style>body{font-family:Calibri,Arial,sans-serif;color:#0f1a14;font-size:11pt;} @page{size:portrait;margin:0.6in;}</style>' +
    '</head><body>';
  var body = gms.map(function(g, i) { return buildWordCard(g, i === gms.length - 1); }).join('');
  return head + body + '</body></html>';
}

// ===== CALIBRATION HEATMAP =====
function avgScores(gms) {
  var sums = [0,0,0,0,0,0], counts = [0,0,0,0,0,0];
  var overallSum = 0, overallCount = 0;
  gms.forEach(function(g) {
    CATEGORIES.forEach(function(c, idx) {
      var v = g[c.key + 'Score'];
      if (!v || v === 'N/A') return;
      var n = parseFloat(v);
      if (isNaN(n)) return;
      sums[idx] += n; counts[idx] += 1;
      overallSum += n; overallCount += 1;
    });
  });
  var perCat = sums.map(function(s, i) { return counts[i] > 0 ? s / counts[i] : null; });
  var overall = overallCount > 0 ? overallSum / overallCount : null;
  return { perCat: perCat, overall: overall, counts: counts };
}
function calScoreClass(avg) {
  if (avg == null) return 'sN';
  if (avg >= 4.5) return 's5';
  if (avg >= 3.5) return 's4';
  if (avg >= 2.5) return 's3';
  if (avg >= 1.5) return 's2';
  return 's1';
}
function fmtAvg(v) {
  return v == null ? '—' : v.toFixed(2);
}
function renderCalibration() {
  if (state.gms.length === 0) {
    return '<div class="empty"><h2>No data to calibrate</h2><p>Add leaders to see per-club score averages across the 6 categories.</p></div>';
  }
  // Group by Club (the GM is the scorer for their club's leaders)
  var byRvp = {};
  visibleGms().forEach(function(g) {
    var k = g.club || '(No club assigned)';
    if (!byRvp[k]) byRvp[k] = [];
    byRvp[k].push(g);
  });
  var rvps = Object.keys(byRvp).sort();
  var rows = '';
  rvps.forEach(function(rvp) {
    var gms = byRvp[rvp];
    var a = avgScores(gms);
    var tds = '<td class="cal-rvp">' + esc(rvp) + '</td>' +
      '<td class="cal-count">' + gms.length + '</td>';
    CATEGORIES.forEach(function(c, i) {
      var avg = a.perCat[i];
      tds += '<td><div class="cal-cell ' + calScoreClass(avg) + '" title="' + (a.counts[i] || 0) + ' scored">' + fmtAvg(avg) + '</div></td>';
    });
    tds += '<td><div class="cal-cell ' + calScoreClass(a.overall) + '">' + fmtAvg(a.overall) + '</div></td>';
    rows += '<tr>' + tds + '</tr>';
  });
  // Portfolio row
  var pa = avgScores(visibleGms());
  var portTds = '<td class="cal-rvp">Portfolio average</td>' +
    '<td class="cal-count">' + visibleGms().length + '</td>';
  CATEGORIES.forEach(function(c, i) {
    var avg = pa.perCat[i];
    portTds += '<td><div class="cal-cell ' + calScoreClass(avg) + '">' + fmtAvg(avg) + '</div></td>';
  });
  portTds += '<td><div class="cal-cell ' + calScoreClass(pa.overall) + '">' + fmtAvg(pa.overall) + '</div></td>';

  var head = '<tr><th class="cal-rvp-th">Club</th><th>Leaders</th>';
  CATEGORIES.forEach(function(c, idx) {
    head += '<th title="' + esc(c.name) + '">' + esc(CAT_SHORT_NAMES[idx]) + '</th>';
  });
  head += '<th>Overall</th></tr>';

  var legend =
    '<div class="cal-legend">' +
    '<span><span class="cal-legend-swatch" style="background:var(--cell-green)"></span>≥ 4.5</span>' +
    '<span><span class="cal-legend-swatch" style="background:var(--cell-blue)"></span>3.5–4.4</span>' +
    '<span><span class="cal-legend-swatch" style="background:var(--cell-white);border:1px solid var(--rule)"></span>2.5–3.4 (honored 3)</span>' +
    '<span><span class="cal-legend-swatch" style="background:var(--cell-yellow)"></span>1.5–2.4</span>' +
    '<span><span class="cal-legend-swatch" style="background:var(--cell-red)"></span>&lt; 1.5</span>' +
    '<span><span class="cal-legend-swatch" style="background:var(--surface3)"></span>no data</span>' +
    '</div>';

  return '<div class="cal-wrap">' +
    '<div class="cal-hdr"><h2>Calibration &mdash; Club × Category Averages' + filterContextSuffix() + '</h2>' +
    '<div class="cal-note">Each cell is the average score (1–5) of the leaders at that club. ' +
    'A large spread across clubs at the same category signals a rating-style difference between GMs, not a population difference.</div></div>' +
    '<table class="cal-table">' +
      '<thead>' + head + '</thead>' +
      '<tbody>' + rows +
        '<tr class="cal-portfolio-row">' + portTds + '</tr>' +
      '</tbody>' +
    '</table>' +
    legend +
    '</div>';
}



function esc(v) {
  if (v == null) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ----- persistence -----
function adoptPayload(p) {
  state.gms = Array.isArray(p.gms) ? p.gms : [];
  state.gms.forEach(function(g) { if (g.club === 'Falcon Crest Golf Course') g.club = 'The Valor Club'; });
  var s = p.session || {};
  state.session = { name: s.name || '', locked: !!s.locked, timerMin: (s.timerMin == null ? 5 : s.timerMin), priorLabel: s.priorLabel || '' };
  state.log = Array.isArray(p.log) ? p.log : [];
}
function buildPayload() {
  return { gms: state.gms, session: state.session, log: state.log, savedAt: new Date().toISOString() };
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.gms)) adoptPayload(parsed);
    }
  } catch (e) { console.warn('loadState failed:', e); }
  try {
    var u = JSON.parse(localStorage.getItem(UI_KEY) || 'null');
    if (u) {
      if (u.filters) state.filters = { club: u.filters.club || '', department: u.filters.department || '', roleTitle: u.filters.roleTitle || '' };
      if (Array.isArray(u.compareSelection)) state.compareSelection = u.compareSelection;
      if (u.compareChartType) state.compareChartType = u.compareChartType;
      if (u.queueSort && u.queueSort !== 'presenter') state.queueSort = u.queueSort;
      if (u.activeView) state.activeView = u.activeView;
    }
  } catch (e2) {}
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPayload())); return true; }
  catch (e) { console.warn('saveState failed:', e); return false; }
}
function saveState() {
  if (!saveLocal()) toast('Could not save in this browser — export an archive now');

}

// ----- undo + activity log -----
function snapPlacement(g) {

}
function pushUndo(g) {

  if (undoStack.length > 50) undoStack.shift();
}
function logMove(g, from, to, action) {

  if (state.log.length > 300) state.log.length = 300;

function undoLast() {

  var g = findGm(u.id);

  var from = isPlaced(g) ? g.placement.label : null;
  g.placement = u.prev.placement; g.status = u.prev.status; g.placedAt = u.prev.placedAt;
  var to = isPlaced(g) ? g.placement.label : null;

// ----- placement -----
function placeOnCell(row, col) {
  var g = getActiveGm();
  if (!g) return;
  pushUndo(g);
  var was = isPlaced(g) ? g.placement.label : null;
  if (g.placement && g.placement.row === row && g.placement.col === col) {
    g.placement = null; g.placedAt = null; g.status = 'in_discussion';
    if (was) logMove(g, was, null, 'unplaced');
    saveState(); render();
    toast((g.name || 'Leader') + ' un-placed — back to discussion');
    return;
  }
  var cell = MATRIX[row][col];
  g.placement = { row: row, col: col, key: cell.key, label: cell.label };
  if (was) { g.placedAt = new Date().toISOString(); logMove(g, was, cell.label, 'moved'); }
  saveState(); render();
}
function confirmPlacement() {
  var g = getActiveGm();
  if (!g || !g.placement) { toast('Place the leader on the matrix first'); return; }
  if (g.status !== 'placed') {
    pushUndo(g);
    g.status = 'placed';
    g.placedAt = new Date().toISOString();
    logMove(g, null, g.placement.label, 'placed');
  }
  saveState();
  toast((g.name || 'Leader') + ' placed in ' + g.placement.label);
  var list = visibleGms(), nextP = null;
  var start = list.indexOf(g);
  for (var k = 1; k <= list.length; k++) {
    var cand = list[(start + k) % list.length];
    if (cand.status !== 'placed' && cand.id !== g.id) { nextP = cand; break; }
  }
  if (nextP) { state.activeGmId = nextP.id; if (nextP.status === 'pending') nextP.status = 'in_discussion'; saveState(); }
  render();
  if (!nextP) toast('Everyone in this view is placed');
}
function movePlacement(id, r, c) {
  var g = findGm(id);
  if (!g) return;
  var from = isPlaced(g) ? g.placement.label : null;
  if (r == null) {
    if (!g.placement) return;
    pushUndo(g);
    g.placement = null; g.placedAt = null; g.status = 'in_discussion';
    if (from) logMove(g, from, null, 'unplaced');
  } else {
    if (isPlaced(g) && g.placement.row === r && g.placement.col === c) return;
    pushUndo(g);
    var cell = MATRIX[r][c];
    g.placement = { row: r, col: c, key: cell.key, label: cell.label };
    g.status = 'placed'; g.placedAt = new Date().toISOString();
    logMove(g, from, cell.label, from ? 'moved' : 'placed');
  }
  saveState(); render();
}

function applyPriorCycle(data) {

  if (!prior) { toast('That file is not a session archive'); return -1; }

var TEMPLATE_BASE = ['Name', 'Department', 'Role Title', 'Club', 'GM', 'Club Type', 'Years with Century', 'Years in Leadership Role', 'Years at this Club'];
var TEMPLATE_TAIL = ['Highlights', 'Edges', 'Opportunities', 'GM Recommendation', 'Next Role Target', 'Successor Candidate'];
function buildCsvTemplate() {
  var headers = TEMPLATE_BASE.slice();
  CAT_SHORT_NAMES.forEach(function(s) { headers.push(s + ' Score', s + ' Headline', s + ' Narrative'); });
  headers = headers.concat(TEMPLATE_TAIL);
  var ex = ['EXAMPLE — delete this row', 'Food & Beverage', 'F&B Director', 'Marbella Country Club', 'GM full name', 'Private', '7', '5', '4'];
  CAT_SHORT_NAMES.forEach(function() { ex.push('3', 'One-line headline', 'Longer notes and examples'); });
  ex = ex.concat(['What is working', 'What to watch', 'What is next', 'What the GM is asking the room to decide', 'e.g. AGM', 'Who could step in']);
  var notes = [
    ['NOTES — rows starting with NOTES or EXAMPLE are ignored on import'],
    ['NOTES — Scores: 1 to 5 in half points or N/A. 3 means fully meets the expectations of the role.'],
    ['NOTES — Department must be one of: ' + DEPARTMENTS.filter(function(d) { return !!d; }).join(' | ')],
    ['NOTES — Club must match the portfolio list exactly: ' + CGP_CLUBS.map(function(c) { return c.name; }).join(' | ')]
  ];
  return [headers, ex].concat(notes).map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');

function downloadCsvTemplate() {

  toast('Template downloaded');
}
function parseRosterCsv(text) {
  var rows = parseCsv(text);
  while (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  if (rows.length < 2) return { error: 'CSV has no data rows' };
  var headers = rows[0].map(function(h) { return String(h).trim(); });
  if (headers.filter(function(h) { return !!CSV_HEADER_MAP[h]; }).length === 0) return { error: 'No recognized columns — start from the roster template' };
  var newGms = [], offList = 0;
  var clubNames = CGP_CLUBS.map(function(c) { return c.name; });
  rows.slice(1).forEach(function(row) {
    var g = newGM(), matRow = '', matCol = '';
    for (var c = 0; c < headers.length; c++) {
      var key = CSV_HEADER_MAP[headers[c]];
      if (!key) continue;
      var v = (row[c] == null) ? '' : String(row[c]).trim();
      if (key === '__matrix_row') matRow = v;

    if (!g.name || /^(EXAMPLE|NOTES)/i.test(g.name)) return;
    var mr = parseInt(matRow, 10), mc = parseInt(matCol, 10);
    if (!isNaN(mr) && !isNaN(mc) && mr >= 0 && mr < 3 && mc >= 0 && mc < 3) {
      var cell = MATRIX[mr][mc];
      g.placement = { row: mr, col: mc, key: cell.key, label: cell.label };
    }
    if (['pending', 'in_discussion', 'placed'].indexOf(g.status) < 0) g.status = g.placement ? 'placed' : 'pending';
    if (g.status === 'placed' && !g.placement) g.status = 'pending';
    if (!g.placedAt) g.placedAt = null;
    if (!g.clubType) g.clubType = clubTypeFor(g.club);
    if ((g.club && clubNames.indexOf(g.club) < 0) || (g.department && DEPARTMENTS.indexOf(g.department) < 0)) offList++;
    newGms.push(g);
  });

}
function commitImport(newGms, mode, extra) {
  if (mode === 'add') {
    var ids = {}; state.gms.forEach(function(g) { ids[g.id] = true; });
    newGms.forEach(function(g) { if (ids[g.id]) g.id = uid(); });
    state.gms = state.gms.concat(newGms);
  } else {
    state.gms = newGms;
    state.log = (extra && Array.isArray(extra.log)) ? extra.log : [];
    if (extra && extra.session) adoptPayload({ gms: newGms, session: extra.session, log: state.log });
    undoStack = []; state.compareSelection = [];
  }
  state.activeGmId = null;
  saveState(); setView('queue');
}
function handleCsvImport(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var res;
    try { res = parseRosterCsv(e.target.result); } catch (err) { toast('CSV parse failed'); return; }
    if (res.error) { toast(res.error); return; }
    askImportMode(res.gms.length, 'Add these rows to it, or replace it?').then(function(mode) {
      if (mode !== 'add' && mode !== 'replace') return;
      commitImport(res.gms, mode, null);
      toast('Imported ' + res.gms.length + ' leaders' + (res.offList ? ' — ' + res.offList + ' have a club or department not on the standard list' : ''));
    });
  };
  reader.onerror = function() { toast('File read failed'); };
  reader.readAsText(file);
}
function handleJsonImport(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var data;
    try { data = JSON.parse(e.target.result); } catch (err) { toast('Invalid JSON file'); return; }
    var gms = Array.isArray(data) ? data : (data && Array.isArray(data.gms) ? data.gms : null);
    if (!gms) { toast('That file is not a session archive'); return; }
    var newGms = [];
    gms.forEach(function(d) {
      if (!d || !d.name) return;
      var g = newGM();
      for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) g[k] = d[k];
      newGms.push(g);
    });
    if (newGms.length === 0) { toast('No leaders found in that file'); return; }
    askImportMode(newGms.length, 'Add the archive\'s leaders to it, or replace it?').then(function(mode) {
      if (mode !== 'add' && mode !== 'replace') return;
      commitImport(newGms, mode, data);
      toast('Imported ' + newGms.length + ' leaders');
    });
  };
  reader.onerror = function() { toast('Could not read file'); };
  reader.readAsText(file);
}

// ----- summary report -----
function sumList(items, fmt, empty) {
  if (!items.length) return '<div class="sum-none">' + empty + '</div>';
  return '<ul class="sum-list">' + items.map(function(g) {
    return '<li onclick="openCard(\'' + g.id + '\')"><strong>' + esc(g.name || '(no name)') + '</strong> ' + fmt(g) +
      '<small>' + esc([g.roleTitle || g.department, g.club].filter(function(x) { return !!x; }).join(' · ')) + '</small></li>';
  }).join('') + '</ul>';
}
function sumTable(title, field, list) {
  var groups = {};
  list.forEach(function(g) { var k = (g[field] || '').trim() || '(not set)'; (groups[k] = groups[k] || []).push(g); });
  var colors = ['green', 'blue', 'white', 'yellow', 'red'];
  var rows = Object.keys(groups).sort().map(function(k) {
    var gs = groups[k];
    var tds = colors.map(function(col) {
      var n = gs.filter(function(g) { return isPlaced(g) && cellColor(g) === col; }).length;
      return '<td>' + (n ? '<span class="sum-dot" style="background:var(--cell-' + col + ')">' + n + '</span>' : '') + '</td>';
    }).join('');
    var pend = gs.filter(function(g) { return !isPlaced(g); }).length;
    return '<tr><td>' + esc(k) + '</td><td>' + gs.length + '</td>' + tds + '<td>' + (pend || '') + '</td><td>' + fmtAvg(avgScores(gs).overall) + '</td></tr>';
  }).join('');
  return '<div class="sum-sec"><h3>' + title + '</h3><table class="sum-table"><thead><tr><th>' + title.replace('By ', '') + '</th><th>Leaders</th><th>Green</th><th>Blue</th><th>White</th><th>Yellow</th><th>Red</th><th>Pending</th><th>Avg score</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function hasSuccessor(g) { var s = String(g.successor || '').trim().toLowerCase(); return !!s && !/^(none|n\/a|na|tbd|-|—)/.test(s); }
function renderSummary() {
  var list = visibleGms();
  var placed = list.filter(isPlaced);
  var tile = function(v, l) { return '<div class="sum-tile"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; };
  var splits = list.filter(function(g) { return g.consensus === 'split'; });
  var top = placed.filter(function(g) { return cellColor(g) === 'green'; });
  var gaps = placed.filter(function(g) { return (cellColor(g) === 'green' || cellColor(g) === 'blue' || g.placement.key === 'hp-lp') && !hasSuccessor(g); });
  var watch = placed.filter(function(g) { return cellColor(g) === 'red' || (cellColor(g) === 'yellow' && g.placement.key !== 'hp-lp'); });
  var up = placed.filter(function(g) { return placementDelta(g) === 'up'; });
  var down = placed.filter(function(g) { return placementDelta(g) === 'down'; });
  var cellOf = function(g) { return '&mdash; ' + esc(g.placement.label); };
  var moved = function(g) { return '&mdash; ' + esc(g.lastCyclePlacementLabel || '') + ' &rarr; ' + esc(g.placement.label); };
  var since = esc(state.session.priorLabel || 'last cycle');
  return '<div class="sum-wrap">' +
    '<div class="sum-hdr"><h2>' + esc(state.session.name || 'Session') + ' &mdash; Summary' + filterContextSuffix() + '</h2>' +
    '<button class="viewbar-action ghost sum-print-btn" style="margin-left:auto" onclick="window.print()">Print</button></div>' +
    '<div class="sum-tiles">' + tile(list.length, 'Leaders') + tile(placed.length, 'Placed') + tile(list.length - placed.length, 'Pending') +
      tile(list.filter(function(g) { return g.consensus === 'consensus'; }).length, 'Consensus') + tile(splits.length, 'Split calls') + '</div>' +
    renderDistributionStrip() +
    '<div class="sum-grid">' +
      '<div class="sum-sec"><h3>Top talent &mdash; ready now</h3>' + sumList(top, function(g) { return g.nextRole ? '&rarr; ' + esc(g.nextRole) : ''; }, 'No one placed in the top-right cell yet.') + '</div>' +
      '<div class="sum-sec"><h3>Succession gaps &mdash; key talent with no successor named</h3>' + sumList(gaps, cellOf, 'No gaps among placed key talent.') + '</div>' +
      '<div class="sum-sec"><h3>Split calls to revisit</h3>' + sumList(splits, function(g) { return g.placement ? cellOf(g) : ''; }, 'No split calls.') + '</div>' +
      '<div class="sum-sec"><h3>Needs attention</h3>' + sumList(watch, cellOf, 'No one placed in a concern cell.') + '</div>' +
      '<div class="sum-sec"><h3>Moved up since ' + since + '</h3>' + sumList(up, moved, 'No upward moves recorded.') + '</div>' +
      '<div class="sum-sec"><h3>Moved down since ' + since + '</h3>' + sumList(down, moved, 'No downward moves recorded.') + '</div>' +
    '</div>' +
    sumTable('By club', 'club', list) + sumTable('By department', 'department', list) +
    '</div>';
}

// ----- encrypted live sync (off until FIREBASE_CONFIG is filled in) -----
// The passcode never leaves the browser. It derives (a) an AES-256 key that encrypts everything
// before upload and (b) the room id, so the database only ever holds unreadable ciphertext.
var sync = { key: null, room: '', ref: null, cursorRef: null, ready: false, timer: null, inflight: false, dirty: false, cursorTimer: null };
function syncOn() { return USE_FIREBASE && !!sync.ref; }
function b64enc(u8) {
  var s = '';
  for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64dec(str) {
  var b = atob(str), u = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function deriveKeys(pass) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']).then(function(k) {
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('cgp-dh-draft-board-v1'), iterations: 200000, hash: 'SHA-256' }, k, 512);
  }).then(function(bits) {
    var u = new Uint8Array(bits), room = '';
    for (var i = 32; i < 52; i++) room += ('0' + u[i].toString(16)).slice(-2);
    return crypto.subtle.importKey('raw', u.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']).then(function(key) { return { key: key, room: room }; });
  });
}
function streamBytes(u8, Ctor) {
  var st = new Ctor('gzip'), w = st.writable.getWriter(), r = st.readable.getReader(), parts = [], n = 0;
  w.write(u8); w.close();
  function pump() {
    return r.read().then(function(x) {
      if (x.done) { var out = new Uint8Array(n), o = 0; parts.forEach(function(p) { out.set(p, o); o += p.length; }); return out; }
      parts.push(x.value); n += x.value.length; return pump();
    });
  }
  return pump();
}
// Large payloads are gzipped before encryption (box.z = 1) so a full roster stays small on the wire.
function encryptObj(obj) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var raw = new TextEncoder().encode(JSON.stringify(obj));
  var zip = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined' && raw.length > 2000;
  return (zip ? streamBytes(raw, CompressionStream) : Promise.resolve(raw)).then(function(bytes) {
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, sync.key, bytes);
  }).then(function(ct) {
    var box = { iv: b64enc(iv), ct: b64enc(new Uint8Array(ct)) };
    if (zip) box.z = 1;
    return box;
  });
}
function decryptObj(box) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(box.iv) }, sync.key, b64dec(box.ct)).then(function(pt) {
    var u = new Uint8Array(pt);
    return box.z ? streamBytes(u, DecompressionStream) : u;
  }).then(function(u) {
    return JSON.parse(new TextDecoder().decode(u));
  });
}
function initFirebase() {
  if (!USE_FIREBASE) { setCloudStatus('off', 'Local'); return; }
  if (typeof firebase === 'undefined' || !window.crypto || !window.crypto.subtle) {
    setCloudStatus('error', 'No sync'); toast('Live sync is not available in this browser'); return;
  }
  setCloudStatus('off', 'Not joined');
  openJoinDialog();
}
function openJoinDialog() {
  showDialog({ title: 'Join the live Draft Board session', dismissable: false, html:
    '<p class="dlg-msg">Enter the passcode the facilitator shared. Everyone using the same passcode sees the same board.</p>' +
    '<div class="form-field"><label>Session passcode</label><input type="password" id="joinPass" autocomplete="off"></div>' +
    '<div class="form-field"><label>Your name</label><input type="text" id="joinName" value="' + esc(state.userName) + '"></div>' +
    '<div class="form-field"><label>Role</label><select id="joinRole"><option value="viewer">Viewer — follow along, no editing</option><option value="facilitator">Facilitator / scribe — can edit</option></select></div>',
    collect: function() {
      return { pass: document.getElementById('joinPass').value, name: document.getElementById('joinName').value.trim(), role: document.getElementById('joinRole').value };
    },
    buttons: [{ label: 'Work offline', value: 'offline' }, { label: 'Join session', value: 'join', kind: 'primary' }]
  }).then(function(r) {
    if (!r || r.value !== 'join') { setCloudStatus('off', 'Offline'); return; }
    if (!r.data.pass || r.data.pass.length < 8) { toast('Use a passcode of at least 8 characters'); openJoinDialog(); return; }
    joinSync(r.data.pass, r.data.role, r.data.name);
  });
}
function leaveSync() {
  if (sync.ref) { try { sync.ref.off(); sync.cursorRef.off(); } catch (e) {} }
  sync.ref = null; sync.cursorRef = null; sync.ready = false; sync.dirty = false;
}
function joinSync(pass, role, name) {
  leaveSync();
  state.role = role; state.userName = name || '';
  setCloudStatus('saving', 'Joining');
  return deriveKeys(pass).then(function(k) {
    sync.key = k.key; sync.room = k.room;
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    var base = firebase.database().ref('draft_board_dh/rooms/' + k.room);
    sync.ref = base.child('state'); sync.cursorRef = base.child('cursor');
    sync.ref.on('value', onRemoteState, function(err) { console.warn('sync error', err); setCloudStatus('error', 'Error'); });
    sync.cursorRef.on('value', onRemoteCursor);
    render();
  }).catch(function(e) { console.warn('join failed', e); setCloudStatus('error', 'Error'); toast('Could not join the live session'); });
}
function userIsTyping() {
  var a = document.activeElement;
  return !!a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && !!a.closest && !!a.closest('#app');
}
function onRemoteState(snap) {
  var d = snap.val();
  var first = !sync.ready;
  sync.ready = true;
  if (!d || !d.ct) {
    setCloudStatus('connected', 'Live');
    if (first && state.role === 'facilitator' && state.gms.length) scheduleCloudSave();
    return;
  }
  if (d.by === CLIENT_ID) { setCloudStatus('connected', 'Live'); return; }
  decryptObj(d).then(function(p) {
    adoptPayload(p); saveLocal();
    setCloudStatus('connected', 'Live');
    if (!userIsTyping()) render();
  }).catch(function() { setCloudStatus('error', 'Unreadable'); });
}
function scheduleCloudSave() {
  if (!syncOn() || state.role !== 'facilitator') return;
  if (!sync.ready) { sync.dirty = true; return; }
  clearTimeout(sync.timer);
  setCloudStatus('saving', 'Saving');
  sync.timer = setTimeout(saveToCloud, 500);
}
function saveToCloud() {
  if (!syncOn()) return;
  if (sync.inflight) { sync.dirty = true; return; }
  sync.inflight = true; sync.dirty = false;
  encryptObj(buildPayload()).then(function(box) {
    box.by = CLIENT_ID; box.at = Date.now();
    return sync.ref.set(box);
  }).then(function() {
    sync.inflight = false; setCloudStatus('connected', 'Live');
    if (sync.dirty) scheduleCloudSave();
  }).catch(function(e) { sync.inflight = false; console.warn('sync write failed', e); setCloudStatus('error', 'Error'); });
}
function pushCursor() {
  if (!syncOn() || state.role !== 'facilitator' || !sync.ready) return;
  clearTimeout(sync.cursorTimer);
  sync.cursorTimer = setTimeout(function() {
    encryptObj({ view: state.activeView, gmId: state.activeGmId, filters: state.filters }).then(function(box) {
      box.by = CLIENT_ID; sync.cursorRef.set(box);
    }).catch(function() {});
  }, 200);
}
function onRemoteCursor(snap) {
  var d = snap.val();
  if (!d || !d.ct || d.by === CLIENT_ID) return;
  if (state.role !== 'viewer' || !state.follow) return;
  decryptObj(d).then(function(c) {
    if (c.view) state.activeView = c.view;
    state.activeGmId = c.gmId || null;
    if (c.filters) state.filters = { club: c.filters.club || '', department: c.filters.department || '', roleTitle: c.filters.roleTitle || '' };
    render();
  }).catch(function() {});
}

// ----- core render loop -----
function setView(view) {
  state.activeView = view;
  render();
}
function render() {
  applyRole();
  updateStats();
  updateFilterSelects();
  saveUi();
  var btns = document.querySelectorAll('.viewbar-btn');
  for (var b = 0; b < btns.length; b++) btns[b].classList.toggle('active', btns[b].getAttribute('data-view') === state.activeView);
  var sn = document.getElementById('sessionName');
  if (sn) sn.textContent = state.session.name ? state.session.name + ' · ' : '';
  var ub = document.getElementById('undoBtn');
  if (ub) ub.disabled = undoStack.length === 0;
  var app = document.getElementById('app');
  if (state.gms.length === 0) { app.innerHTML = renderEmpty(); pushCursor(); return; }
  if (visibleGms().length === 0) { app.innerHTML = renderFilterEmpty(); pushCursor(); return; }
  if (state.activeView === 'card') app.innerHTML = renderCard();
  else if (state.activeView === 'compare') app.innerHTML = renderCompare();
  else if (state.activeView === 'calibration') app.innerHTML = renderCalibration();
  else if (state.activeView === 'board') app.innerHTML = renderBoard();
  else if (state.activeView === 'summary') app.innerHTML = renderSummary();
  else { state.activeView = 'queue'; app.innerHTML = renderQueue(); }

  if (state.activeView === 'card') {
    var cells = document.querySelectorAll('.matrix-panel .matrix-cell[data-row]');
    for (var i = 0; i < cells.length; i++) {
      (function(el) {
        el.addEventListener('click', function() {
          placeOnCell(parseInt(el.getAttribute('data-row'), 10), parseInt(el.getAttribute('data-col'), 10));
        });
      })(cells[i]);
    }
    if (state.activeGmId !== discTimer.id) { discTimer.id = state.activeGmId; discTimer.start = Date.now(); }
    timerTick();
  }
  pushCursor();
}
function renderEmpty() {
  return '<div class="empty"><h2>No leaders added yet</h2>' +
    '<p>Load the roster before the session: download the template, have each GM fill in their leaders, then import it. In the room you will open one Card at a time &mdash; discuss, place on the matrix, confirm, next.</p>' +
    '<button class="viewbar-action edit-only" onclick="downloadCsvTemplate()">Download roster template</button>' +
    '<button class="viewbar-action ghost edit-only" onclick="openCsvImport()" style="margin-left:8px;">Import CSV</button>' +
    '<button class="viewbar-action ghost edit-only" onclick="openAddModal()" style="margin-left:8px;">+ Add one leader</button>' +
    '<button class="viewbar-action ghost edit-only" onclick="loadSampleGMs()" style="margin-left:8px;">Load 5 samples (FICTIONAL)</button>' +
    '</div>';
}
function handleKey(e) {
  if (dialogOpen()) { if (e.key === 'Escape' && dlgDismissable) closeDialog(0); return; }
  var modal = document.getElementById('modalBg');
  if (modal && !modal.classList.contains('hidden')) { if (e.key === 'Escape') closeModal(); return; }
  var tag = (e.target && e.target.tagName) || '';
  var typing = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'z' && !typing) { undoLast(); e.preventDefault(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  var k = String(e.key).toLowerCase();
  if (e.key === '/') { var qs = document.getElementById('quickSearch'); if (qs) qs.focus(); e.preventDefault(); return; }
  if (e.key === 'Escape') { if (document.body.classList.contains('present')) togglePresent(false); return; }
  if (k === 'p') { togglePresent(); return; }
  if (k === 'q') { setView('queue'); return; }
  if (k === 'c') { setView('card'); return; }
  if (k === 'b') { setView('board'); return; }
  if (k === 's') { setView('summary'); return; }
  if (state.activeView !== 'card') return;
  if (e.key === 'ArrowLeft') { navigateGM(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { navigateGM(1); e.preventDefault(); }
  else if (e.key === 'Enter') { var g = getActiveGm(); if (g && g.placement) { confirmPlacement(); e.preventDefault(); } }
  else if (/^[1-9]$/.test(e.key)) {
    var map = { '7':[0,0],'8':[0,1],'9':[0,2],'4':[1,0],'5':[1,1],'6':[1,2],'1':[2,0],'2':[2,1],'3':[2,2] };
    var co = map[e.key]; placeOnCell(co[0], co[1]); e.preventDefault();
  }
}
function init() {
  loadState();
  loadTheme();
  document.getElementById('sessionDate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  document.addEventListener('keydown', handleKey);
  document.addEventListener('fullscreenchange', function() { if (!document.fullscreenElement) document.body.classList.remove('present'); });
  installGuards();
  setInterval(timerTick, 1000);
  setCloudStatus('off', 'Local');
  render();
  initFirebase();
}

init();
</script>
