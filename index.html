<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGP Draft Board — Department Heads &amp; Managers</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',Helvetica,Arial,sans-serif;
  --cell-green:#D5E8D4;--cell-blue:#DAE8FC;--cell-white:#FFFFFF;--cell-yellow:#FFF2CC;--cell-red:#F8CECC;
  --green-900:#0a2318;--green-800:#14532d;--green-700:#15803d;--green-100:#dcfce7;
  --ink:#0f1a14;--ink2:#3a4a3f;--ink3:#7a8c80;--ink4:#b0bdb5;
  --surface:#fff;--surface2:#f4f6f4;--surface3:#edf0ec;
  --rule:rgba(0,0,0,0.10);
  --shadow:0 2px 8px rgba(0,0,0,0.08),0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.14);
  --radius:10px;--radius-sm:6px;
}
html{font-size:15px}
body{font-family:var(--sans);background:var(--surface2);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

/* ===== TOP NAV ===== */
.topnav{background:var(--green-900);color:#fff;display:flex;align-items:center;padding:0 24px;height:56px;flex-shrink:0}
.topnav-logo{display:flex;align-items:center;margin-right:18px;background:#fff;padding:4px 8px;border-radius:6px}
.topnav-logo svg{display:block;height:40px;width:auto}
.topnav-logo img{display:block;height:40px;width:auto}
.topnav-title{font-size:15px;font-weight:500;color:rgba(255,255,255,.92)}
.topnav-sub{font-size:12px;color:rgba(255,255,255,.5);margin-left:10px}
.topnav-spacer{flex:1}
.topnav-stat{display:flex;flex-direction:column;align-items:center;padding:0 16px;border-left:1px solid rgba(255,255,255,.08)}
.topnav-stat-val{font-family:var(--serif);font-size:20px;line-height:1}
.topnav-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.6);margin-top:3px}
.cloud-dot{display:inline-block;width:10px;height:10px;border-radius:999px;background:#6b7280;margin-bottom:2px}
.cloud-dot.connected{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.cloud-dot.saving{background:#3b82f6;animation:pulse 1.2s infinite}
.cloud-dot.error{background:#ef4444}
.cloud-dot.off{background:#6b7280}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== VIEW BAR ===== */
.viewbar{background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 24px;height:48px;gap:4px}
.viewbar-btn{background:transparent;border:none;padding:8px 16px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;border-radius:6px;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px}
.viewbar-btn:hover{background:var(--surface2)}
.viewbar-btn.active{color:var(--green-700);border-bottom-color:var(--green-700);border-radius:6px 6px 0 0}
.viewbar-spacer{flex:1}
.viewbar-action{background:var(--green-700);color:#fff;border:none;padding:8px 16px;font-family:var(--sans);font-weight:500;font-size:13px;border-radius:6px;cursor:pointer}
.viewbar-action:hover{background:var(--green-800)}
.viewbar-action.ghost{background:transparent;color:var(--ink2);border:1px solid var(--rule)}
.viewbar-action.ghost:hover{background:var(--surface2)}
.viewbar-action.danger{background:transparent;color:#b91c1c;border:1px solid #fecaca}
.viewbar-action.danger:hover{background:#fef2f2}
.viewbar-filter{padding:7px 12px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff;color:var(--ink);max-width:220px;cursor:pointer;margin-right:4px}
.viewbar-filter:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
body[data-theme="dark"] .viewbar-filter{background:var(--surface3);color:var(--ink);border-color:var(--rule)}

.app{flex:1;padding:24px;overflow:auto}
.empty{background:#fff;border:1px dashed var(--rule);border-radius:var(--radius);padding:60px 32px;text-align:center;color:var(--ink3)}
.empty h2{font-family:var(--serif);color:var(--ink);font-size:22px;margin-bottom:8px}
.empty p{font-size:14px;max-width:520px;margin:0 auto 20px}

/* ===== QUEUE VIEW ===== */
.queue-grp{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.queue-grp-hdr{background:var(--surface3);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.queue-grp-hdr .rvp{font-weight:700;font-size:14px;color:var(--ink)}
.queue-grp-hdr .region{font-size:12px;color:var(--ink3)}
.queue-grp-hdr .count{margin-left:auto;font-size:12px;color:var(--ink2);background:#fff;padding:2px 8px;border-radius:999px;border:1px solid var(--rule)}
.queue-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .1s}
.queue-row:last-child{border-bottom:none}
.queue-row:hover{background:var(--surface2)}
.queue-row .qr-name{font-weight:500;font-size:14px;min-width:200px;display:flex;align-items:center;gap:10px}
.queue-row .qr-club{font-size:13px;color:var(--ink2);flex:1}
.qr-thumb{width:28px;height:28px;border-radius:999px;background:var(--surface3);object-fit:cover;border:1px solid var(--rule);display:inline-block}
.qr-thumb-init{width:28px;height:28px;border-radius:999px;background:var(--green-700);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.qr-status{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:4px 10px;border-radius:999px;min-width:110px;text-align:center}
.qr-status.pending{background:var(--surface3);color:var(--ink3)}
.qr-status.in_discussion{background:#fef3c7;color:#92400e}
.qr-status.placed{background:var(--green-100);color:var(--green-800)}
.qr-readiness{font-size:12px;color:var(--ink2);min-width:140px}
.qr-cell{font-size:11px;color:var(--ink2);padding:3px 8px;border-radius:4px;background:var(--surface3);min-width:110px;text-align:center}
.qr-edit{background:transparent;border:1px solid var(--rule);color:var(--ink2);font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.qr-edit:hover{background:var(--surface2)}
.queue-toolbar{display:flex;align-items:center;gap:10px;padding:0 4px 14px;flex-wrap:wrap}
.queue-toolbar-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink2);font-weight:700}
.queue-toolbar select{padding:7px 12px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff;color:var(--ink);min-width:240px}
.queue-toolbar select:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.queue-toolbar-note{font-size:11px;color:var(--ink3);margin-left:auto}
.qsort-grp{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.qsort-grp-hdr{background:var(--surface3);padding:8px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.qsort-grp-hdr .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);font-weight:700}
.qsort-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .1s}
.qsort-row:last-child{border-bottom:none}
.qsort-row:hover{background:var(--surface2)}
.qsort-rank{width:28px;font-family:var(--serif);font-size:18px;color:var(--ink3);text-align:right}
.qsort-score{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:700;border:1px solid rgba(0,0,0,0.08);flex-shrink:0}
.qsort-score.s5{background:var(--cell-green)}
.qsort-score.s4{background:var(--cell-blue)}
.qsort-score.s3{background:var(--cell-white);border:1px solid var(--rule)}
.qsort-score.s2{background:var(--cell-yellow)}
.qsort-score.s1{background:var(--cell-red)}
.qsort-score.sN{background:var(--surface3);color:var(--ink3);font-family:var(--sans);font-size:11px}
.qsort-name{font-weight:600;font-size:14px;min-width:160px}
.qsort-name-sub{font-size:11px;color:var(--ink3);font-weight:400;margin-top:2px}
.qsort-rvp-pill{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;background:var(--surface3);color:var(--ink2);border-radius:4px;white-space:nowrap}
.qsort-club{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.qsort-headline{font-size:12px;color:var(--ink2);font-style:italic;flex:2;min-width:0}

body[data-theme="dark"] .queue-toolbar select{background:var(--surface3);color:var(--ink);border-color:var(--rule)}
body[data-theme="dark"] .qsort-grp{background:var(--surface)}
body[data-theme="dark"] .qsort-grp-hdr{background:var(--surface3)}
body[data-theme="dark"] .qsort-row:hover{background:var(--surface3)}
body[data-theme="dark"] .qsort-score{color:#0f1a14}
body[data-theme="dark"] .qsort-score.sN{color:var(--ink3)}
body[data-theme="dark"] .qsort-rvp-pill{background:var(--surface3);color:var(--ink2)}

/* ===== CARD VIEW ===== */
.card-view{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;min-height:calc(100vh - 56px - 48px - 48px)}
.gm-card{background:#fff;border-radius:var(--radius);border:1px solid var(--rule);box-shadow:var(--shadow);padding:0;overflow:auto;display:flex;flex-direction:column}

/* Header band */
.gm-hdr{padding:18px 22px;border-bottom:2px solid var(--green-700);display:flex;align-items:flex-start;gap:16px;background:linear-gradient(180deg,#fff 0%,var(--surface2) 100%)}
.gm-photo{width:96px;height:96px;border-radius:8px;background:var(--surface3);overflow:hidden;flex-shrink:0;border:1px solid var(--rule)}
.gm-photo img{width:100%;height:100%;object-fit:cover}
.gm-photo .initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:32px;color:var(--green-700)}
.gm-hdr-meta{flex:1;min-width:0}
.gm-hdr-name{font-family:var(--serif);font-size:26px;line-height:1.05}
.gm-hdr-title{font-size:13px;color:var(--ink2);margin-top:2px}
.gm-hdr-club{font-size:14px;color:var(--ink);margin-top:8px;font-weight:600}
.gm-hdr-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gm-hdr-tag{font-size:11px;padding:3px 8px;background:#fff;border:1px solid var(--rule);border-radius:999px;color:var(--ink2)}
.gm-hdr-tag strong{color:var(--ink);font-weight:600}
.gm-hdr-nav{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
.gm-hdr-nav-row{display:flex;gap:6px}
.gm-hdr-nav button{background:transparent;border:1px solid var(--rule);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink2)}
.gm-hdr-nav button:hover{background:var(--surface2)}
.gm-hdr-pos{font-size:11px;color:var(--ink3)}

/* Body sections */
.gm-body{padding:18px 22px;flex:1}
.gm-section{margin-bottom:18px}
.gm-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--green-700);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.gm-section-label .sub{color:var(--ink3);font-weight:500;letter-spacing:.4px;text-transform:none;font-size:11px}
.gm-section-body{font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.gm-section-body.empty-body{color:var(--ink4);font-style:italic}

/* Tenure strip */
.tenure-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px;max-width:520px}
.tenure-tile{background:var(--surface2);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.tenure-tile .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:700}
.tenure-tile .val{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.1;margin-top:2px}
.tenure-tile .val.text{font-family:var(--sans);font-size:13px;font-weight:500}

/* Financial snapshot */
.fin-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.fin-tile{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px}
.fin-tile .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:700;line-height:1.2}
.fin-tile .val{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.1;margin-top:4px}
.fin-tile .det{font-size:10px;color:var(--ink3);margin-top:3px;line-height:1.2}

/* Per-category scoring rows */
.cat-row{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.cat-row:last-child{border-bottom:none}
.cat-row.has-self{grid-template-columns:48px 1fr auto}
.cat-self{text-align:right;font-size:11px;color:var(--ink3);white-space:nowrap;padding-top:2px}
.cat-self b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:400;line-height:1.1}
.pc-gap{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--ink2)}
.pc-gap.big{background:#fdf0c4;color:#7a5600}
.pc-avg{display:flex;justify-content:space-between;gap:12px;padding:10px 0 2px;border-top:2px solid var(--rule);font-weight:700;font-size:13px}
.pc-note{font-size:11px;color:var(--ink3);font-style:italic;margin-top:6px}
.pc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pc-tile{background:var(--surface2);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.pc-tile .lbl{font-size:9px;letter-spacing:.8px;font-weight:700;color:var(--ink3)}
.pc-tile .val{font-family:var(--serif);font-size:22px;line-height:1.1}
.pc-tile .sub{font-size:10.5px;color:var(--ink3)}
.pc-q{display:grid;grid-template-columns:46px 1fr 40px 90px 52px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--rule)}
.pc-q .grp{font-size:9px;letter-spacing:.6px;color:var(--ink3);font-weight:700}
.pc-q .sc{font-weight:700;text-align:right}
.pc-q .bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.pc-q .bar i{display:block;height:100%;background:#c9a227}
.pc-q .bar i.hd{background:#8fa6d8}
.pc-q .rk{font-size:11px;color:var(--ink3)}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc-box{background:var(--surface2);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.45;white-space:pre-line}
.pc-box.signals{background:#fdf3cf;border-color:#ecd98a;color:#3d3200}
.pc-box .gm-narr-label{color:var(--green-700)}
.pc-box.signals .gm-narr-label{color:#7a5600}
.pc-box .hint{font-size:10.5px;font-style:italic;opacity:.8;margin-bottom:3px}
.pc-sub{font-size:12.5px;line-height:1.5;margin-bottom:6px}
.pc-sub b{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-right:6px}
.pc-src{font-size:10.5px;color:var(--ink3);margin:4px 0 18px}
@media(max-width:700px){.pc-grid{grid-template-columns:1fr}.pc-q{grid-template-columns:40px 1fr 36px 48px}.pc-q .bar{display:none}}
.cat-score-chip{width:48px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:700;border:1px solid rgba(0,0,0,0.08);font-variant-numeric:tabular-nums}
.cat-score-chip.s5{background:var(--cell-green)}
.cat-score-chip.s4{background:var(--cell-blue)}
.cat-score-chip.s3{background:var(--cell-white);border:1px solid var(--rule)}
.cat-score-chip.s2{background:var(--cell-yellow)}
.cat-score-chip.s1{background:var(--cell-red)}
.cat-score-chip.sN{background:var(--surface3);color:var(--ink3);font-size:13px;font-family:var(--sans);font-weight:600}
.cat-info{min-width:0}
.cat-info-hdr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cat-num{display:inline-block;background:var(--green-700);color:#fff;width:18px;height:18px;border-radius:999px;text-align:center;font-size:11px;line-height:18px;font-weight:700}
.cat-name{font-size:13px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}
.cat-sub-badge{font-size:10px;background:var(--surface3);color:var(--ink2);padding:2px 6px;border-radius:4px;font-weight:600}
.cat-headline{font-size:14px;color:var(--ink);margin-top:4px;line-height:1.35;font-weight:500}
.cat-headline.empty-body{color:var(--ink4);font-style:italic;font-weight:400}
.cat-narrative{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.45;white-space:pre-wrap}
.cat-narrative.empty-body{color:var(--ink4);font-style:italic}

/* Narratives strip */
.gm-narratives{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.gm-narr{background:var(--surface2);padding:10px 12px;border-radius:6px}
.gm-narr-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.gm-narr.highlights .gm-narr-label{color:var(--green-700)}
.gm-narr.edges .gm-narr-label{color:#b45309}
.gm-narr.opps .gm-narr-label{color:#1d4ed8}
.gm-narr-body{font-size:13px;line-height:1.4;color:var(--ink);white-space:pre-wrap}
.gm-narr-body.empty-body{color:var(--ink4);font-style:italic}

/* ===== MATRIX PANEL ===== */
.matrix-panel{background:#fff;border-radius:var(--radius);border:1px solid var(--rule);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;overflow:auto;height:fit-content}
.matrix-panel h3{font-family:var(--serif);font-size:20px;color:var(--ink)}
.matrix-panel h3 .h3-sub{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px}

/* Axis layout — 3 labels per axis */
.matrix-wrap{display:grid;grid-template-columns:24px 60px 1fr;grid-template-rows:1fr 24px 28px;gap:0}
.axis-y-title{grid-row:1;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;color:var(--green-700);padding:8px 0}
.axis-y-labels{grid-row:1;grid-column:2;display:flex;flex-direction:column;justify-content:space-around;align-items:flex-end;padding-right:8px}
.axis-y-labels span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);text-align:right}
.axis-code{font-family:var(--serif);font-size:13px;font-weight:400;color:var(--green-700);letter-spacing:0}
.matrix-grid{grid-row:1;grid-column:3;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px;min-height:320px}
.axis-x-labels{grid-row:2;grid-column:3;display:flex;justify-content:space-around;align-items:center;padding-top:4px}
.axis-x-labels span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2)}
.axis-x-title{grid-row:3;grid-column:3;display:flex;justify-content:center;align-items:center;font-family:var(--serif);font-size:14px;color:var(--green-700);padding-top:4px}

.matrix-cell{border:2px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:transform .1s,border-color .1s,box-shadow .1s;min-height:92px}
.matrix-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.matrix-cell.selected{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,26,20,.15)}
.mc-bg-green{background:var(--cell-green)}
.mc-bg-blue{background:var(--cell-blue)}
.mc-bg-white{background:var(--cell-white);border:1px solid var(--rule)}
.mc-bg-white.selected{border:2px solid var(--ink)}
.mc-bg-yellow{background:var(--cell-yellow)}
.mc-bg-red{background:var(--cell-red)}
.mc-label{font-size:12px;font-weight:700;line-height:1.15;color:var(--ink)}
.mc-key{position:absolute;top:6px;right:8px;font-size:10px;color:rgba(15,26,20,.4);font-weight:700}

/* Readiness + actions */
.controls-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.ctrl-field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2);margin-bottom:4px}
.ctrl-field input,.ctrl-field select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff}
.ctrl-field input:focus,.ctrl-field select:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.action-row{display:flex;gap:10px;align-items:center;margin-top:8px}
.btn-confirm{flex:1;background:var(--green-700);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer}
.btn-confirm:hover{background:var(--green-800)}
.btn-confirm:disabled{background:var(--ink4);cursor:not-allowed}
.btn-skip{background:transparent;color:var(--ink2);border:1px solid var(--rule);padding:12px 16px;border-radius:8px;font-family:var(--sans);font-size:13px;cursor:pointer}
.btn-skip:hover{background:var(--surface2)}

/* ===== BOARD VIEW ===== */
.board-wrap{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.board-hdr{display:flex;align-items:baseline;margin-bottom:18px;gap:12px}
.board-hdr h2{font-family:var(--serif);font-size:26px}
.board-hdr .placed-stat{margin-left:auto;font-size:13px;color:var(--ink2)}
.board-wrap .matrix-grid .matrix-cell{min-height:180px;align-items:stretch;cursor:default}
.board-wrap .matrix-grid .matrix-cell:hover{transform:none;box-shadow:none}
.bc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.bc-label{font-size:12px;font-weight:700;line-height:1.1;color:var(--ink)}
.bc-axis{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(15,26,20,.55)}
.bc-count{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1;text-align:right}
.bc-pct{font-size:11px;color:var(--ink3);font-weight:600;line-height:1;margin-top:3px;text-align:right;letter-spacing:.2px}
.bc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;overflow:auto}
.bc-chip{background:rgba(255,255,255,.7);color:var(--ink);font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,0.08);cursor:pointer;white-space:nowrap}
.bc-chip:hover{background:#fff;border-color:var(--ink2)}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(15,26,20,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:980px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-hdr{padding:18px 24px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.modal-hdr h2{font-family:var(--serif);font-size:22px}
.modal-close{margin-left:auto;background:transparent;border:none;font-size:24px;color:var(--ink3);cursor:pointer;line-height:1}
.modal-body{padding:20px 24px;overflow:auto;flex:1}
.modal-ftr{padding:14px 24px;border-top:1px solid var(--rule);background:var(--surface2);display:flex;gap:10px;align-items:center}
.modal-btn{padding:9px 18px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:500;border:1px solid var(--rule);background:#fff;color:var(--ink2);cursor:pointer}
.modal-btn:hover{background:var(--surface2)}
.modal-btn-primary{background:var(--green-700);color:#fff;border-color:var(--green-700)}
.modal-btn-primary:hover{background:var(--green-800)}
.modal-btn-danger{color:#b91c1c;border-color:#fecaca;margin-right:auto}
.modal-btn-danger:hover{background:#fef2f2}

.form-section{margin-bottom:22px}
.form-section-label{font-family:var(--serif);font-size:14px;color:var(--green-700);margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.form-field{margin-bottom:10px}
.form-field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin-bottom:4px}
.form-field label .required{color:#dc2626}
.form-field input,.form-field textarea,.form-field select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff}
.form-field textarea{resize:vertical;min-height:60px;line-height:1.45}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(21,128,61,.12)}

/* Headshot widget */
.headshot-widget{display:flex;gap:14px;align-items:center;padding:12px;background:var(--surface2);border-radius:6px;border:1px solid var(--rule)}
.headshot-preview{width:80px;height:80px;border-radius:8px;overflow:hidden;background:var(--surface3);flex-shrink:0;border:1px solid var(--rule)}
.headshot-preview img{width:100%;height:100%;object-fit:cover}
.headshot-preview .initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;color:var(--green-700)}
.headshot-controls{display:flex;flex-direction:column;gap:6px}
.headshot-hint{font-size:11px;color:var(--ink3)}
.headshot-btns{display:flex;gap:6px}
.headshot-btn{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink2);cursor:pointer}
.headshot-btn:hover{background:var(--surface2)}
.headshot-btn.danger{color:#b91c1c;border-color:#fecaca}

/* Category form block */
.cat-form-block{background:var(--surface2);border-radius:6px;padding:12px;margin-bottom:10px;border-left:3px solid var(--green-700)}
.cat-form-hdr{display:grid;grid-template-columns:auto 1fr 104px 104px;gap:10px;align-items:center;margin-bottom:8px}
.cat-form-name{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.cat-num-label{display:inline-block;background:var(--green-700);color:#fff;width:20px;height:20px;border-radius:999px;text-align:center;font-size:11px;line-height:20px;font-weight:700;margin-right:6px}
.cat-form-block .form-field{margin-bottom:6px}
.cat-form-block .cat-sub-hint{font-size:11px;color:var(--ink3);font-style:italic;margin-bottom:6px}

/* ===== DARK MODE ===== */
body[data-theme="dark"]{
  --ink:#e8eae6;
  --ink2:#b9c2bc;
  --ink3:#8a948e;
  --ink4:#5a635e;
  --surface:#1c2520;
  --surface2:#121814;
  --surface3:#2a342e;
  --rule:rgba(255,255,255,0.10);
  --green-100:#1a3a26;
  --shadow:0 2px 8px rgba(0,0,0,0.40),0 1px 2px rgba(0,0,0,0.30);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.50);
}
body[data-theme="dark"] .app{background:var(--surface2)}
body[data-theme="dark"] .gm-card,
body[data-theme="dark"] .matrix-panel,
body[data-theme="dark"] .queue-grp,
body[data-theme="dark"] .board-wrap,
body[data-theme="dark"] .modal{background:var(--surface)}
body[data-theme="dark"] .gm-hdr{background:linear-gradient(180deg,var(--surface) 0%,var(--surface3) 100%)}
body[data-theme="dark"] .viewbar{background:var(--surface);border-bottom-color:var(--rule)}
body[data-theme="dark"] .modal-ftr{background:var(--surface3)}
body[data-theme="dark"] .queue-grp-hdr{background:var(--surface3)}
body[data-theme="dark"] .gm-narr,
body[data-theme="dark"] .tenure-tile,
body[data-theme="dark"] .cat-form-block,
body[data-theme="dark"] .headshot-widget{background:var(--surface3)}
body[data-theme="dark"] .fin-tile,
body[data-theme="dark"] .gm-hdr-tag{background:var(--surface3);color:var(--ink)}
body[data-theme="dark"] .form-field input,
body[data-theme="dark"] .form-field textarea,
body[data-theme="dark"] .form-field select,
body[data-theme="dark"] .ctrl-field input,
body[data-theme="dark"] .ctrl-field select{background:var(--surface3);color:var(--ink);border-color:var(--rule)}
body[data-theme="dark"] .modal-btn,
body[data-theme="dark"] .viewbar-action.ghost,
body[data-theme="dark"] .qr-edit,
body[data-theme="dark"] .gm-hdr-nav button,
body[data-theme="dark"] .headshot-btn,
body[data-theme="dark"] .btn-skip{background:var(--surface);color:var(--ink2);border-color:var(--rule)}
body[data-theme="dark"] .viewbar-btn{color:var(--ink2)}
body[data-theme="dark"] .viewbar-btn:hover,
body[data-theme="dark"] .modal-btn:hover,
body[data-theme="dark"] .viewbar-action.ghost:hover,
body[data-theme="dark"] .qr-edit:hover,
body[data-theme="dark"] .gm-hdr-nav button:hover,
body[data-theme="dark"] .headshot-btn:hover,
body[data-theme="dark"] .btn-skip:hover,
body[data-theme="dark"] .queue-row:hover{background:var(--surface3)}
body[data-theme="dark"] .empty{background:var(--surface);border-color:var(--rule)}
body[data-theme="dark"] .empty h2{color:var(--ink)}
body[data-theme="dark"] .gm-photo,
body[data-theme="dark"] .qr-thumb,
body[data-theme="dark"] .qr-thumb-init,
body[data-theme="dark"] .headshot-preview{background:var(--surface3);border-color:var(--rule)}
body[data-theme="dark"] .form-section-label{border-bottom-color:var(--rule)}
body[data-theme="dark"] .gm-hdr{border-bottom-color:var(--green-700)}
body[data-theme="dark"] .gm-cat-body{color:var(--ink)}
body[data-theme="dark"] .cat-narrative{color:var(--ink2)}
body[data-theme="dark"] .cat-headline{color:var(--ink)}
body[data-theme="dark"] .cat-sub-badge{background:var(--surface3);color:var(--ink2)}
body[data-theme="dark"] .qr-cell{background:var(--surface3);color:var(--ink2)}
body[data-theme="dark"] .qr-status.pending{background:var(--surface3);color:var(--ink3)}
body[data-theme="dark"] .qr-status.in_discussion{background:#4a2f0a;color:#fcd34d}
body[data-theme="dark"] .qr-status.placed{background:var(--green-100);color:#86efac}
/* Matrix cells: keep dark text on pastel backgrounds — cells are the functional signal */
body[data-theme="dark"] .matrix-cell .mc-label,
body[data-theme="dark"] .matrix-cell .mc-key{color:#0f1a14}
body[data-theme="dark"] .matrix-cell.mc-bg-white{background:var(--cell-white);border:1px solid rgba(0,0,0,0.2)}
body[data-theme="dark"] .matrix-cell.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.25)}
body[data-theme="dark"] .bc-label,
body[data-theme="dark"] .bc-count,
body[data-theme="dark"] .bc-axis{color:#0f1a14}
body[data-theme="dark"] .bc-pct{color:rgba(15,26,20,0.65)}
body[data-theme="dark"] .bc-chip{background:rgba(255,255,255,0.88);color:#0f1a14;border-color:rgba(0,0,0,0.15)}
body[data-theme="dark"] .bc-chip:hover{background:#fff;border-color:#0f1a14}
/* Score chips: dark text since they sit on pastel */
body[data-theme="dark"] .cat-score-chip{color:#0f1a14}
body[data-theme="dark"] .cat-score-chip.s3{background:var(--cell-white);border:1px solid rgba(0,0,0,0.15)}
body[data-theme="dark"] .cat-score-chip.sN{background:var(--surface3);color:var(--ink2);border-color:var(--rule)}
body[data-theme="dark"] .modal-bg{background:rgba(0,0,0,0.72)}
body[data-theme="dark"] .cat-row{border-bottom-color:var(--rule)}
body[data-theme="dark"] .modal-close{color:var(--ink3)}
body[data-theme="dark"] kbd{background:var(--surface3);border-color:var(--rule);color:var(--ink2)}

/* ===== DATA DROPDOWN MENU ===== */
.menu-wrap{position:relative;display:inline-block}
.menu-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow-lg);min-width:200px;padding:6px;z-index:120;display:none}
.menu-dropdown.open{display:block}
.menu-section{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);padding:8px 10px 4px;font-weight:700}
.menu-item{display:flex;align-items:center;width:100%;background:transparent;border:none;padding:8px 10px;border-radius:6px;font-family:var(--sans);font-size:13px;color:var(--ink2);cursor:pointer;text-align:left;gap:8px}
.menu-item:hover{background:var(--surface2);color:var(--ink)}
.menu-item-divider{height:1px;background:var(--rule);margin:4px 0}
body[data-theme="dark"] .menu-dropdown{background:var(--surface)}
body[data-theme="dark"] .menu-item:hover{background:var(--surface3)}

/* ===== CALIBRATION HEATMAP ===== */
.cal-wrap{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.cal-hdr{display:flex;align-items:baseline;margin-bottom:18px;gap:12px}
.cal-hdr h2{font-family:var(--serif);font-size:26px}
.cal-hdr .cal-note{margin-left:auto;font-size:12px;color:var(--ink3)}
.cal-table{width:100%;border-collapse:collapse;font-size:13px}
.cal-table th,.cal-table td{padding:10px 8px;border-bottom:1px solid var(--rule);text-align:center}
.cal-table th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);font-weight:700;background:var(--surface2);position:sticky;top:0}
.cal-table th.cal-rvp-th,.cal-table td.cal-rvp{text-align:left;font-weight:600;color:var(--ink);min-width:160px}
.cal-table td.cal-count{color:var(--ink2);font-weight:500;width:60px}
.cal-cell{font-family:var(--serif);font-size:16px;font-weight:700;width:64px;color:var(--ink);border-radius:4px}
.cal-cell.s5{background:var(--cell-green)}
.cal-cell.s4{background:var(--cell-blue)}
.cal-cell.s3{background:var(--cell-white);border:1px solid var(--rule)}
.cal-cell.s2{background:var(--cell-yellow)}
.cal-cell.s1{background:var(--cell-red)}
.cal-cell.sN{color:var(--ink4);font-family:var(--sans);font-size:12px;font-weight:500}
.cal-portfolio-row td{background:var(--surface3);font-weight:700;border-top:2px solid var(--ink3)}
.cal-portfolio-row .cal-rvp{color:var(--ink);font-style:italic}
.cal-legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink2)}
.cal-legend-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,0.08)}

body[data-theme="dark"] .cal-wrap{background:var(--surface)}
body[data-theme="dark"] .cal-table th{background:var(--surface3)}
body[data-theme="dark"] .cal-cell{color:#0f1a14}
body[data-theme="dark"] .cal-cell.sN{color:var(--ink4)}
body[data-theme="dark"] .cal-portfolio-row td{background:var(--surface3)}

/* ===== TIER 2: notes, consensus, delta ===== */
.notes-section textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;line-height:1.45;background:#fff;color:var(--ink);resize:vertical}
.notes-section textarea:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.consensus-control{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.consensus-control label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink2)}
.consensus-control select{padding:6px 10px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff;color:var(--ink)}
.consensus-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.consensus-pill.consensus{background:#dcfce7;color:#15803d}
.consensus-pill.split{background:#fef3c7;color:#92400e}
.delta-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;background:var(--surface2);color:var(--ink2);border-radius:999px;border:1px solid var(--rule);margin-top:6px}
.delta-badge.up{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
.delta-badge.down{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.delta-badge.same{color:var(--ink3)}
.delta-arrow{font-weight:700;font-size:13px}
.qsort-delta,.qr-delta{font-size:13px;font-weight:700;width:18px;text-align:center}
.qsort-delta.up,.qr-delta.up{color:#15803d}
.qsort-delta.down,.qr-delta.down{color:#b91c1c}
.qsort-delta.same,.qr-delta.same{color:var(--ink4)}

body[data-theme="dark"] .notes-section textarea{background:var(--surface3);color:var(--ink);border-color:var(--rule)}
body[data-theme="dark"] .consensus-control select{background:var(--surface3);color:var(--ink);border-color:var(--rule)}
body[data-theme="dark"] .consensus-pill.consensus{background:#1a3a26;color:#86efac}
body[data-theme="dark"] .consensus-pill.split{background:#3a2f10;color:#fcd34d}
body[data-theme="dark"] .delta-badge.up{color:#86efac;border-color:#1a3a26;background:#0f1f15}
body[data-theme="dark"] .delta-badge.down{color:#fca5a5;border-color:#3a1414;background:#1f0f0f}

/* ===== DISTRIBUTION CHECK (Board view) ===== */
.dist-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.dist-swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,0.10)}
.dist-tile{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:14px;border-top:3px solid rgba(0,0,0,0.15);position:relative}
.dist-tile.ok{border-top-color:#22c55e}
.dist-tile.warn{border-top-color:#f59e0b}
.dist-tile.alert{border-top-color:#ef4444;animation:dist-pulse 1.8s infinite}
.dist-tile.neutral{border-top-color:rgba(0,0,0,0.18)}
@keyframes dist-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 4px rgba(239,68,68,0.18)}}
.dist-name{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.dist-name .info-mark{font-size:9px;color:var(--ink4);font-weight:500}
.dist-num-row{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.dist-count{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1}
.dist-pct{font-size:15px;color:var(--ink);font-weight:600}
.dist-target{font-size:11px;color:var(--ink3);margin-top:4px}
.dist-status{font-size:11px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.dist-status.ok{color:#16a34a}
.dist-status.warn{color:#d97706}
.dist-status.alert{color:#dc2626}
.dist-status.neutral{color:var(--ink3);font-weight:500}

body[data-theme="dark"] .dist-tile{background:var(--surface)}
body[data-theme="dark"] .dist-status.ok{color:#86efac}
body[data-theme="dark"] .dist-status.warn{color:#fcd34d}
body[data-theme="dark"] .dist-status.alert{color:#fca5a5}

@media print{
  .dist-tile{break-inside:avoid}
  .dist-tile.alert{animation:none}
}

/* ===== COMPARE VIEW ===== */
.cmp-wrap{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.cmp-hdr{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.cmp-pick{flex:1;min-width:300px}
.cmp-pick-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2);margin-bottom:8px}
.cmp-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cmp-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;color:#fff;font-size:13px;font-weight:500}
.cmp-chip-rm{background:rgba(255,255,255,0.25);color:#fff;border:none;width:18px;height:18px;border-radius:999px;cursor:pointer;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.cmp-chip-rm:hover{background:rgba(255,255,255,0.4)}
.cmp-chip.group{border:2px dashed rgba(255,255,255,0.75)}
.cmp-chip .cmp-chip-kind{font-size:9px;text-transform:uppercase;letter-spacing:.7px;opacity:.85;margin-right:2px}
.cmp-add-section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:700;padding:8px 10px 4px}
.cmp-add-option .cmp-grp-ico{width:24px;height:24px;border-radius:6px;background:var(--surface3);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.cmp-add{background:transparent;border:1px dashed var(--rule);color:var(--ink2);padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.cmp-add:hover{background:var(--surface2);border-color:var(--ink3)}
.cmp-add:disabled{opacity:0.4;cursor:not-allowed}
.cmp-toggle{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.cmp-toggle button{background:transparent;border:none;padding:8px 14px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:var(--sans)}
.cmp-toggle button.active{background:var(--green-700);color:#fff}
.cmp-toggle button:hover:not(.active){background:var(--surface2)}
.cmp-empty{padding:80px 24px;text-align:center;color:var(--ink3);font-size:14px}
.cmp-chart{position:relative}
.cmp-chart svg{display:block;max-width:680px;margin:0 auto;width:100%}
.cmp-legend{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.cmp-legend-item{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.cmp-swatch{display:inline-block;width:14px;height:14px;border-radius:3px}
.cmp-add-popover{position:absolute;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;z-index:50;min-width:260px;padding:6px}
.cmp-add-option{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.cmp-add-option:hover{background:var(--surface2)}
.cmp-add-option .qr-thumb,
.cmp-add-option .qr-thumb-init{width:24px;height:24px;font-size:10px}
.cmp-cats-table{margin-top:16px;font-size:12px;color:var(--ink2);width:100%;border-collapse:collapse}
.cmp-cats-table td,.cmp-cats-table th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--rule)}
.cmp-cats-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3)}

/* Dark mode for Compare */
body[data-theme="dark"] .cmp-wrap{background:var(--surface)}
body[data-theme="dark"] .cmp-add-popover{background:var(--surface)}
body[data-theme="dark"] .cmp-add-option:hover{background:var(--surface3)}
body[data-theme="dark"] .cmp-toggle button:hover:not(.active){background:var(--surface3)}

/* Flagged financial tiles */
.fin-tile.flagged{background:#fff8e1;border-color:#f5d97c}
.fin-flag{color:#b45309;font-size:14px;margin-left:4px}
body[data-theme="dark"] .fin-tile.flagged{background:#3a2e10;border-color:#8a6a1e;color:#fbbf24}
body[data-theme="dark"] .fin-tile.flagged .lbl,
body[data-theme="dark"] .fin-tile.flagged .val,
body[data-theme="dark"] .fin-tile.flagged .det{color:#fbbf24}
body[data-theme="dark"] .fin-flag{color:#fbbf24}

/* Print */
@media print{
  .topnav,.viewbar{display:none!important}
  .app{padding:0}
  .board-wrap{box-shadow:none;border:none}
  .bc-chip{background:#fff;border:1px solid #aaa}
  .cmp-wrap{box-shadow:none;border:none;padding:0}
  .cmp-add,.cmp-chip-rm,.cmp-toggle{display:none!important}
  .cmp-chips{gap:6px}
  .cmp-chip{padding:4px 12px}
}
/* Orientation is set dynamically by printBoard() and printOnePager() via injected @page rules */

/* Util */
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:opacity .2s,transform .2s;transform:translateY(8px)}
.toast.show{opacity:1;transform:translateY(0)}
.kbd-hint{font-size:11px;color:var(--ink3);margin-left:8px}
kbd{font-family:'SF Mono',Monaco,monospace;background:var(--surface3);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--ink2)}

/* ===== V2: toolbar, dialogs, board, presentation, summary ===== */
.viewbar{height:auto;min-height:48px;flex-wrap:wrap;row-gap:6px;padding:6px 16px}
.viewbar-btn{padding:8px 12px;white-space:nowrap}
.viewbar-action{white-space:nowrap}
.viewbar-action:disabled{opacity:.4;cursor:default}
.viewbar-filter{max-width:150px}
.menu-item.danger{color:#b91c1c}
.menu-dropdown{max-height:80vh;overflow:auto;min-width:230px}
.qs-wrap{position:relative}
.qs-wrap input{padding:7px 12px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;width:170px;background:#fff;color:var(--ink)}
.qs-wrap input:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.qs-results{position:absolute;top:calc(100% + 4px);left:0;min-width:280px;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow-lg);z-index:130;padding:4px;display:none}
.qs-results.open{display:block}
.qs-item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.qs-item:hover,.qs-item.first{background:var(--surface2)}
.qs-item small{display:block;color:var(--ink3);font-size:11px}
.session-banner{background:#fef3c7;color:#92400e;font-size:13px;padding:8px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #fde68a}
.session-banner button{background:#fff;border:1px solid #fcd34d;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:#92400e}
.session-banner label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.modal.dlg{max-width:480px}
.dlg-msg{font-size:14px;line-height:1.5;color:var(--ink2);white-space:pre-line}
.dlg-danger{background:#b91c1c;color:#fff;border-color:#b91c1c}
.dlg-danger:hover{background:#991b1b}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.dlg-keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;color:var(--ink2)}
body.readonly .edit-only,body.readonly .qr-edit,body.readonly .action-row,body.readonly #undoBtn{display:none!important}
body.readonly .notes-section textarea,body.readonly .ctrl-field input,body.readonly .ctrl-field select{pointer-events:none;opacity:.8}
body.readonly .matrix-panel .matrix-cell{cursor:default}
/* Board */
.board-hdr{flex-wrap:wrap}
.board-hdr .board-tools{display:flex;gap:8px}
.board-wrap .matrix-grid .matrix-cell{min-height:190px}
.bc-code{display:inline-block;font-family:var(--serif);font-size:13px;color:rgba(15,26,20,.55);margin-right:6px}
.bc-label{font-size:13px}
.bc-chips{gap:6px;align-content:flex-start}
.bc-chip{display:inline-flex;flex-direction:column;align-items:flex-start;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;white-space:normal;line-height:1.2;background:rgba(255,255,255,.85);position:relative}
.bc-chip[draggable="true"]{cursor:grab}
.bc-chip-sub{font-size:10px;font-weight:400;color:#5b6b60;margin-top:1px}
.bc-chip-flag{position:absolute;top:-6px;right:-6px;font-size:11px;background:#fef3c7;border-radius:999px;padding:0 4px;border:1px solid #fcd34d}
.matrix-cell.drop-hot,.bd-bench.drop-hot{outline:3px dashed var(--green-700);outline-offset:-3px}
.bd-bench{border:1px dashed var(--rule);border-radius:var(--radius);padding:10px 12px;margin-bottom:16px;background:var(--surface2)}
.bd-bench-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--ink3);margin-bottom:8px}
.bd-bench .bc-chips{margin-top:0}
.bd-bench .bc-chip{background:#fff}
.bd-log{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px;font-size:13px}
.bd-log summary{cursor:pointer;font-weight:600;color:var(--ink2)}
.bd-log-row{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule);color:var(--ink2)}
.bd-log-row time{color:var(--ink3);font-variant-numeric:tabular-nums}
/* Timer */
.disc-timer{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink3);cursor:pointer;margin-top:2px}
.disc-timer.warn{color:#b45309;font-weight:700}
.disc-timer.over{color:#b91c1c;font-weight:700}
/* Summary */
.sum-wrap{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.sum-hdr{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sum-hdr h2{font-family:var(--serif);font-size:26px}
.sum-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.sum-tile{background:var(--surface2);border:1px solid var(--rule);border-radius:8px;padding:12px}
.sum-tile .v{font-family:var(--serif);font-size:28px;line-height:1}
.sum-tile .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:700;margin-top:4px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.sum-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--green-700);margin:14px 0 8px}
.sum-table{width:100%;border-collapse:collapse;font-size:13px}
.sum-table th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);text-align:center;padding:6px;border-bottom:1px solid var(--rule)}
.sum-table th:first-child,.sum-table td:first-child{text-align:left}
.sum-table td{padding:6px;border-bottom:1px solid var(--rule);text-align:center}
.sum-dot{display:inline-block;min-width:24px;padding:2px 6px;border-radius:4px;border:1px solid rgba(0,0,0,.08);color:#0f1a14}
.sum-list{list-style:none;font-size:13px}
.sum-list li{padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.sum-list li small{color:var(--ink3);display:block;font-size:11px}
.sum-none{font-size:13px;color:var(--ink4);font-style:italic}
/* Presentation mode */
.present-bar{display:none}
body.present .topnav,body.present .viewbar,body.present .session-banner,body.present .queue-toolbar,body.present .gm-hdr-nav-row,body.present .bd-log,body.present .board-tools,body.present .edit-only,body.present .qr-edit{display:none!important}
body.present .app{zoom:1.2;padding:16px}
body.present .present-bar{display:flex;position:fixed;right:14px;bottom:14px;gap:6px;z-index:90;opacity:.2;transition:opacity .15s;background:var(--green-900);padding:6px;border-radius:10px}
body.present .present-bar:hover{opacity:1}
.present-bar button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-family:var(--sans);font-size:13px;cursor:pointer}
.present-bar button:hover{background:rgba(255,255,255,.25)}
body[data-theme="dark"] .qs-wrap input,body[data-theme="dark"] .qs-results,body[data-theme="dark"] .sum-wrap,body[data-theme="dark"] .bd-bench .bc-chip{background:var(--surface3);color:var(--ink);border-color:var(--rule)}
body[data-theme="dark"] .bc-chip{color:#0f1a14}
body[data-theme="dark"] .bd-bench .bc-chip .bc-chip-sub{color:var(--ink3)}
@media print{.bd-bench,.bd-log,.board-tools,.present-bar,.session-banner,.sum-print-btn{display:none!important}.sum-wrap{box-shadow:none;border:none;padding:0}}
@media (max-width:900px){.sum-grid{grid-template-columns:1fr}.sum-tiles{grid-template-columns:repeat(3,1fr)}.card-view{grid-template-columns:1fr}}
@media (max-width:900px){.dist-strip{grid-template-columns:repeat(3,1fr)}.topnav{height:auto;min-height:56px;flex-wrap:wrap;padding:6px 16px}.topnav-stat{padding:0 10px}.board-wrap,.sum-wrap{padding:16px}.board-hdr h2,.sum-hdr h2{font-size:21px}}
</style>
</head>

// Tier 2 helper: compute placement delta direction
function placementDelta(g) {
  if (!g.placement) return null;
  var lr = parseInt(g.lastCyclePlacementRow, 10);
  var lc = parseInt(g.lastCyclePlacementCol, 10);
  if (isNaN(lr) || isNaN(lc)) return null;
  var currentScore = (2 - g.placement.row) + g.placement.col;
  var lastScore = (2 - lr) + lc;
  if (currentScore > lastScore) return 'up';
  if (currentScore < lastScore) return 'down';
  return 'same';
}
function placementDeltaGlyph(d) {
  if (d === 'up') return '↗';
  if (d === 'down') return '↘';
  if (d === 'same') return '→';
  return '';
}
function renderDeltaBadge(g) {
  var d = placementDelta(g);
  if (!d) return '';
  var lastLabel = esc(g.lastCyclePlacementLabel || 'Last cycle');
  var currLabel = g.placement ? esc(g.placement.label) : '—';
  var dateBit = g.lastCycleDate ? ' (' + esc(g.lastCycleDate) + ')' : '';
  return '<div class="delta-badge ' + d + '">' +
    '<span>' + lastLabel + dateBit + '</span>' +
    '<span class="delta-arrow">' + placementDeltaGlyph(d) + '</span>' +
    '<span>' + currLabel + '</span>' +
    '</div>';
}

// ===== FILTERS (Club / Department / Role) =====
var FILTER_FIELDS = [
  { key: 'club',       elId: 'clubFilter', allLabel: 'All clubs',       name: 'Club' },
  { key: 'department', elId: 'deptFilter', allLabel: 'All departments', name: 'Department' },
  { key: 'roleTitle',  elId: 'roleFilter', allLabel: 'All roles',       name: 'Role' }
];

function gmMatchesFilters(g, skipKey) {
  for (var i = 0; i < FILTER_FIELDS.length; i++) {
    var k = FILTER_FIELDS[i].key;
    if (k === skipKey) continue;
    var want = state.filters[k];
    if (want && (g[k] || '').trim() !== want) return false;
  }
  return true;
}
function visibleGms() {
  if (!anyFilterActive()) return state.gms;
  return state.gms.filter(function(g) { return gmMatchesFilters(g, null); });
}
function anyFilterActive() {
  return !!(state.filters.club || state.filters.department || state.filters.roleTitle);
}
// Options cascade: each dropdown only offers values that still exist under the OTHER active filters
function filterOptionsFor(key) {
  var seen = [];
  state.gms.forEach(function(g) {
    if (!gmMatchesFilters(g, key)) return;
    var v = (g[key] || '').trim();
    if (v && seen.indexOf(v) < 0) seen.push(v);
  });
  return seen.sort();
}
function setFilter(key, v) {
  state.filters[key] = v;
  render();
}
function clearFilters() {
  state.filters = { club: '', department: '', roleTitle: '' };
  render();
}
function activeFilterLabel() {
  var parts = [];
  FILTER_FIELDS.forEach(function(f) {
    if (state.filters[f.key]) parts.push(state.filters[f.key]);
  });
  return parts.join(' \u00b7 ');
}
function filterContextSuffix() {
  var l = activeFilterLabel();
  return l ? ' &mdash; ' + esc(l) : '';
}
function updateFilterSelects() {
  FILTER_FIELDS.forEach(function(f) {
    var sel = document.getElementById(f.elId);
    if (!sel) return;
    var opts = filterOptionsFor(f.key);
    // Drop a selection that no longer exists under the other filters
    if (state.filters[f.key] && opts.indexOf(state.filters[f.key]) < 0) state.filters[f.key] = '';
    var html = '<option value="">' + esc(f.allLabel) + '</option>';
    opts.forEach(function(v) {
      html += '<option value="' + esc(v) + '"' + (state.filters[f.key] === v ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    sel.innerHTML = html;
    sel.style.display = (opts.length || state.filters[f.key]) ? '' : 'none';
  });
  var btn = document.getElementById('clearFiltersBtn');
  if (btn) btn.style.display = anyFilterActive() ? '' : 'none';
}
function renderFilterEmpty() {

function getInitials(name) {
  if (!name) return '?';
  var parts = String(name).replace(/\(.*?\)/g, '').trim().split(/\s+/);
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}


function getOverallScore(g) {
  var sum = 0, n = 0;
  for (var i = 0; i < CATEGORIES.length; i++) {
    var v = g[CATEGORIES[i].key + 'Score'];
    if (!v || v === 'N/A') continue;
    var num = parseFloat(v);
    if (!isNaN(num)) { sum += num; n += 1; }
  }
  return n > 0 ? (sum / n) : null;
}

function renderQueueSorted() {
  var sortKey = state.queueSort; // 'catN', 'overall', or 'presenter'
  // Annotate each GM with its sort value
  var annotated = visibleGms().map(function(g) {
    var rawScore, numScore, label;
    if (sortKey === 'presenter') {
      var idx = presenterOrderIndex(g.name);
      numScore = (idx >= 9999) ? null : idx;
      label = (idx >= 9999) ? '—' : String(idx + 1);
    } else if (sortKey === 'overall') {
      var avg = getOverallScore(g);
      numScore = avg;
      label = (avg == null) ? '—' : avg.toFixed(2);
    } else {
      rawScore = g[sortKey + 'Score'];
      if (!rawScore || rawScore === 'N/A') {
        numScore = null;
        label = rawScore || '—';
      } else {
        var n = parseFloat(rawScore);
        numScore = isNaN(n) ? null : n;
        label = rawScore;
      }
    }
    return { g: g, num: numScore, label: label };
  });
  // Sort: presenter ascending (lower index first); scores descending; nulls at bottom; ties by name
  var ascending = (sortKey === 'presenter');
  annotated.sort(function(a, b) {
    if (a.num == null && b.num == null) return (a.g.name || '').localeCompare(b.g.name || '');
    if (a.num == null) return 1;
    if (b.num == null) return -1;
    if (b.num !== a.num) return ascending ? (a.num - b.num) : (b.num - a.num);
    return (a.g.name || '').localeCompare(b.g.name || '');
  });

  var labelText;
  if (sortKey === 'presenter') labelText = 'Presenter order (CGP custom)';
  else if (sortKey === 'overall') labelText = 'Overall score (average of 6 categories)';
  else labelText = 'Score for ' + CATEGORIES[parseInt(sortKey.replace('cat', ''), 10) - 1].name;

  var rows = annotated.map(function(item, idx) {
    var g = item.g;
    var scoreStr = item.label;
    var scoreNum = item.num;
    var chipClass = 'sN';
    var chipText;
    if (sortKey === 'presenter') {
      // Show position label as neutral chip
      chipClass = 'sN';
      chipText = scoreStr;
    } else {
      if (scoreNum != null) {
        var rounded = Math.round(scoreNum);
        if (rounded >= 5) chipClass = 's5';
        else if (rounded === 4) chipClass = 's4';
        else if (rounded === 3) chipClass = 's3';
        else if (rounded === 2) chipClass = 's2';
        else if (rounded <= 1 && rounded >= 1) chipClass = 's1';
        else chipClass = 's3';
      }
      chipText = (sortKey === 'overall' && scoreNum != null)
        ? scoreNum.toFixed(1)
        : (scoreNum != null ? String(scoreNum) : (scoreStr || '—'));
    }

    var headlineHtml = '';
    if (sortKey === 'presenter') {
      headlineHtml = '<div class="qsort-headline"><span style="color:var(--ink4)">CGP custom order</span></div>';
    } else if (sortKey !== 'overall') {
      var h = g[sortKey + 'Headline'] || '';
      headlineHtml = '<div class="qsort-headline">' + (h ? esc(h) : '<span style="color:var(--ink4)">— no headline —</span>') + '</div>';
    } else {
      headlineHtml = '<div class="qsort-headline"><span style="color:var(--ink4)">' +
        CATEGORIES.map(function(c) {
          var s = g[c.key + 'Score'];
          return c.num + ': ' + (s || '—');
        }).join(' · ') + '</span></div>';
    }

    var thumb = g.headshotDataUrl
      ? '<img class="qr-thumb" src="' + esc(g.headshotDataUrl) + '" alt="">'
      : '<span class="qr-thumb-init">' + esc(getInitials(g.name)) + '</span>';

    return '<div class="qsort-row" onclick="openCard(\'' + g.id + '\')">' +
      '<div class="qsort-rank">' + (idx + 1) + '</div>' +
      '<div class="qsort-score ' + chipClass + '">' + esc(chipText) + '</div>' +
      thumb +
      '<div class="qsort-name">' + esc(g.name || '(no name)') + '<div class="qsort-name-sub">' + esc(g.club || '') + '</div></div>' +
      '<span class="qsort-rvp-pill">' + esc(g.department || '—') + '</span>' +
      headlineHtml +
      '<div class="qr-cell">' + esc(g.placement ? g.placement.label : '—') + '</div>' +
      (function() {
        var d = placementDelta(g);
        return d ? '<span class="qsort-delta ' + d + '" title="vs last cycle">' + placementDeltaGlyph(d) + '</span>' : '<span class="qsort-delta"></span>';
      })() +
      (g.consensus ? '<span class="consensus-pill ' + g.consensus + '">' + (g.consensus === 'consensus' ? '✓' : '⚠') + '</span>' : '') +
      '<button class="qr-edit" onclick="event.stopPropagation(); openEditModal(\'' + g.id + '\')">Edit</button>' +
      '</div>';
  }).join('');

  return '<div class="qsort-grp">' +
    '<div class="qsort-grp-hdr"><span class="label">' + labelText + '</span><span style="margin-left:auto;font-size:12px;color:var(--ink3);">' + annotated.length + ' leaders</span></div>' +
    rows +
    '</div>';
}

        '</div>';
    });

  return html;

function getActiveGm() {
  var list = visibleGms();
  if (list.length === 0) return null;
  if (state.activeGmId) {
    for (var i = 0; i < list.length; i++) if (list[i].id === state.activeGmId) return list[i];
  }
  for (var j = 0; j < list.length; j++) if (list[j].status !== 'placed') return list[j];
  return list[0];
}

function openCard(gmId) {
  state.activeGmId = gmId;
  var g = null;
  for (var i = 0; i < state.gms.length; i++) if (state.gms[i].id === gmId) { g = state.gms[i]; break; }
  if (g && g.status === 'pending') { g.status = 'in_discussion'; saveState(); }
  setView('card');
}

function scoreChipClass(score) {
  if (score === 'N/A' || score === '' || score == null) return 'sN';
  var n = parseFloat(score);
  if (isNaN(n)) return 'sN';
  var r = Math.round(n);
  if (r >= 5) return 's5';
  if (r === 4) return 's4';
  if (r === 3) return 's3';
  if (r === 2) return 's2';
  if (r <= 1) return 's1';
  return 'sN';
}

// ----- player card fields (self scores, intangibles, signals, asked for, next steps, bench) -----
function hasPC(g) { return !!(g.pcGroup || g.intangibles || g.signals || g.askedFor || g.gmNextSteps || g.bench); }
function pcNum(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
function pcAvg(g, suffix) {
  var s = 0, n = 0;
  CATEGORIES.forEach(function(c) { var v = pcNum(g[c.key + suffix]); if (v != null) { s += v; n++; } });
  return n ? s / n : null;
}
function pcPairGap(g) {
  var s = 0, n = 0;
  CATEGORIES.forEach(function(c) { var a = pcNum(g[c.key + 'Score']), b = pcNum(g[c.key + 'Self']); if (a != null && b != null) { s += b - a; n++; } });
  return n ? s / n : null;
}
function pcFix2(x) {
  var m = Math.round(x * 1000) / 10, f = Math.floor(m), r = m - f;
  var n = Math.abs(r - 0.5) < 1e-9 ? (f % 2 === 0 ? f : f + 1) : Math.round(m);
  return (n / 100).toFixed(2);
}
function pcSigned(d, txt) { return (d > 0 ? '+' : '') + txt; }
function pcGapHtml(a, b) {
  if (a == null || b == null) return '';
  var d = Math.round((b - a) * 100) / 100;
  var t = d === 0 ? '0' : pcSigned(d, (Math.round(d * 2) === d * 2) ? d.toFixed(1) : String(d));
  return '<span class="pc-gap' + (Math.abs(d) >= 1 ? ' big' : '') + '">' + t + '</span>';
}
function pcAvgGapText(g) {
  var d = pcPairGap(g);
  if (d == null) return '';
  var t = pcFix2(d);
  if (t === '-0.00') t = '0.00';
  return (t.charAt(0) === '-' ? '' : '+') + t;
}
function pcBox(cls, label, hint, body) {
  return '<div class="pc-box' + (cls ? ' ' + cls : '') + '"><div class="gm-narr-label">' + label + '</div>' +
    (hint ? '<div class="hint">' + hint + '</div>' : '') + (body ? esc(body) : '<span class="empty-body">&mdash;</span>') + '</div>';
}
function pcSectionsHtml(g) {
  if (!hasPC(g)) return '';
  var h = '', it = g.intangibles;

    (it ? ' <span class="sub">online assessment' + (it.date ? ', ' + esc(it.date) : '') + ' &middot; percentile vs. department heads who completed it</span>' : '') + '</div>';
  if (!it) h += '<div class="gm-section-body empty-body">Intangibles not completed.</div>';
  else {
    h += '<div class="pc-tiles">' + ['heart', 'head', 'hands'].map(function(k, i) {
      return '<div class="pc-tile"><div class="lbl">' + k.toUpperCase() + '</div><div class="val">' + esc(it[k] || '—') + '</div>' +
        '<div class="sub">Group avg ' + esc((it.avg || [])[i] || '—') + ' &middot; ' + esc((it.pct || [])[i] || '—') + '</div></div>';
    }).join('') + '</div>';
    (it.q || []).forEach(function(q) {
      var p = /lowest/i.test(q[3]) ? 2 : (/highest/i.test(q[3]) ? 100 : (parseInt(q[3], 10) || 0));
      h += '<div class="pc-q"><span class="grp">' + esc(q[0]) + '</span><span>' + esc(q[1]) + '</span><span class="sc">' + esc(q[2]) + '</span>' +
        '<span class="bar"><i' + (q[0] === 'HEAD' ? ' class="hd"' : '') + ' style="width:' + Math.max(2, Math.min(100, p)) + '%"></i></span>' +
        '<span class="rk">' + esc(q[3]) + '</span></div>';
    });
  }
  h += '</div>';
  if (g.subHigh || g.subLow || g.subNA) {

      (g.subHigh ? '<div class="pc-sub"><b>At 4 or 5</b>' + esc(g.subHigh) + '</div>' : '') +
      (g.subLow ? '<div class="pc-sub"><b>At 2 or below</b>' + esc(g.subLow) + '</div>' : '') +

  }
  h += '<div class="gm-section"><div class="pc-grid">' +
    pcBox('signals', 'Signals for the committee', 'Prepared from the sources, not the GM&rsquo;s words. Draft.', g.signals) +
    pcBox('', 'What they asked for', '', g.askedFor) +
    pcBox('', 'GM&rsquo;s next steps', '', g.gmNextSteps) +
    pcBox('', 'Bench', '', g.bench) + '</div></div>';
  var r = g.rank;
  if (r) {
    var grp = esc(g.pcGroup || 'group');
    h += '<div class="gm-section"><div class="gm-section-label">Rankings <span class="sub">1 = highest &middot; as of the player cards</span></div>' +
      '<div class="pc-sub"><b>GM feedback</b>' + esc(r.gmAll || 'n/r') + ' overall &middot; ' + esc(r.gmGroup || 'n/r') + ' in ' + grp + '</div>' +
      '<div class="pc-sub"><b>Intangibles</b>' + esc(r.intAll || 'n/r') + ' overall &middot; ' + esc(r.intGroup || 'n/r') + ' in ' + grp + '</div></div>';
  }
  if (g.sources) h += '<div class="pc-src">Sources: ' + esc(g.sources) + '</div>';
  return h;

function renderCard() {

  var list = visibleGms();

function renderMatrix(placement, withKbd) {
